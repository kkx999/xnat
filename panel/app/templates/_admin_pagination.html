{% if total_pages > 1 %}
<div class="pagination">
  {% if page > 1 %}
    <a href="/admin?section={{ section }}&q={{ urlencode(q) }}&page={{ page - 1 }}">上一页</a>
  {% else %}
    <span class="disabled">上一页</span>
  {% endif %}

  <span>第 {{ page }} / {{ total_pages }} 页</span>

  {% if page < total_pages %}
    <a href="/admin?section={{ section }}&q={{ urlencode(q) }}&page={{ page + 1 }}">下一页</a>
  {% else %}
    <span class="disabled">下一页</span>
  {% endif %}
</div>
{% endif %}
