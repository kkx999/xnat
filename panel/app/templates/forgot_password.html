{% extends "base.html" %}
{% block title %}找回密码 · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-shell"><section class="auth-card compact-auth"><span class="eyebrow">RECOVERY</span><h1>找回密码</h1><p>输入注册邮箱。如果邮件服务已配置，我们会发送一个 30 分钟有效的重置链接。</p>
<form method="post" action="/forgot-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>邮箱<input type="email" name="email" required></label><button class="btn wide" type="submit">发送重置邮件</button></form><a class="auth-back" href="/login">返回登录</a></section></div>
{% endblock %}
