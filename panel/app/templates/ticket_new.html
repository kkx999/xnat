{% extends "base.html" %}
{% block title %}新建工单 · {{ app_name }}{% endblock %}
{% block client_header %}
<span class="client-kicker">SUPPORT</span>
<h1>新建工单</h1>
<p>尽量写清实例名、发生时间、操作步骤和错误信息，方便快速定位问题。</p>
{% endblock %}
{% block content %}
<section class="client-panel ticket-compose">
  <div class="ticket-compose-head">
    <div><h2>工单内容</h2><p>问题描述支持较长内容，可直接粘贴日志或错误信息。</p></div>
  </div>
  <form class="settings-form ticket-compose-form" method="post" action="/tickets/new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>标题
      <input name="subject" maxlength="160" placeholder="例如：nat-1-7 无法连接 SSH" required>
    </label>
    <label>优先级
      <select name="priority"><option value="normal">普通</option><option value="low">低</option><option value="high">高</option></select>
    </label>
    <label>问题描述
      <textarea class="ticket-description" name="body" rows="14" maxlength="20000" placeholder="请描述：实例名、发生时间、操作步骤、预期结果、实际结果、错误信息……" required></textarea>
      <small>最多 20,000 个字符。</small>
    </label>
    <button class="ticket-submit-button" type="submit">提交工单</button>
  </form>
</section>
{% endblock %}
