{% extends "auth_base.html" %}
{% block title %}重置密码 · {{ app_name }}{% endblock %}
{% block auth_kicker %}NEW PASSWORD{% endblock %}
{% block auth_heading %}设置新密码{% endblock %}
{% block auth_description %}新密码至少 10 个字符。完成后所有已登录会话都会失效。{% endblock %}
{% block auth_content %}
<form class="auth-v106-form" method="post" action="/reset-password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ reset_token }}">
  <label><span>新密码</span><div class="auth-v106-input auth-v106-password"><input type="password" name="password" minlength="10" autocomplete="new-password" placeholder="至少 10 个字符" required autofocus><button type="button" data-auth-password-toggle aria-label="显示密码" aria-pressed="false">显示</button></div></label>
  <button class="auth-v106-primary" type="submit" data-loading-label="正在重置…"><span>重置密码</span><i>→</i></button>
</form>
{% endblock %}
