{% extends "base.html" %}
{% block title %}重置密码 · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-shell"><section class="auth-card compact-auth"><span class="eyebrow">RECOVERY</span><h1>设置新密码</h1><p>新密码至少 10 个字符。完成后所有已登录会话都会失效。</p>
<form method="post" action="/reset-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ reset_token }}"><label>新密码<input type="password" name="password" minlength="10" required></label><button class="btn wide" type="submit">重置密码</button></form></section></div>
{% endblock %}
