name: Verify v1.0.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release candidate transforms
        run: |
          python tools/v104_agent_header.py
          python tools/v104_agent_routes.py
          python tools/v104_base.py
          python tools/v104_remote.py
          python tools/v104_remote_metrics.py
          python tools/v104_main_metrics.py
          python tools/v104_mobile_metrics.py
          python tools/v104_ui_template.py
          python tools/v104_ui_css.py
          python tools/v104_ui_js.py
          python tools/v104_panel_access_filter.py
          python tools/v104_release_meta.py
          python tools/v104_upgrade_path.py
          python tools/v104_checks.py
      - name: Check
        run: bash scripts/check.sh
