name: Prepare XNAT v1.6.5

on:
  push:
    branches:
      - release/v1.6.5

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6.5
          fetch-depth: 0

      - name: Apply release patch
        run: python3 tools/prepare-v165.py

      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check -q -r panel/requirements.txt -r agent/requirements.txt

      - name: Full regression check
        run: bash scripts/check.sh

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v165.yml tools/prepare-v165.py
          git add VERSION release.json scripts/install-host.sh scripts/check.sh README.md CHANGELOG.md
          git commit -m "fix(host): calculate natpool after Host dependencies"
          git push origin HEAD:release/v1.6.5
