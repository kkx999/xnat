name: Publish XNAT v1.6.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 90be9863ebd33cbff340db3adbe86baba8674455
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          test "$(git show "${TARGET_SHA}:VERSION")" = "1.6.4"
          test "$(git show "${TARGET_SHA}:panel/VERSION")" = "1.6.3"
          test "$(git show "${TARGET_SHA}:agent/VERSION")" = "1.2.1"
          python3 - <<'PY'
          import json, subprocess, os
          sha=os.environ['TARGET_SHA']
          raw=subprocess.check_output(['git','show',f'{sha}:release.json'], text=True)
          d=json.loads(raw)
          assert d['release_version']=='1.6.4'
          assert d['panel_version']=='1.6.3'
          assert d['agent_version']=='1.2.1'
          assert d['agent_api_version']=='1'
          assert d['mobile_api_version']=='1'
          PY

      - name: Publish formal release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## XNAT v1.6.4

          Host 稳定性修复版本。

          - Host Agent 升级至 **v1.2.1**；Panel 保持 **v1.6.3**，Agent API / Mobile API 均保持 **v1**。
          - 创建、重装 VPS 与新增 NAT 端口前检查 Host 系统盘；低于 512MiB 时仅执行安全白名单清理。
          - Incus proxy 因 `No space left on device` 失败时，会读取对应 proxy 日志确认 ENOSPC，安全清理后仅重试一次；仍失败则返回明确的 HTTP 507 空间不足错误。
          - 自动/手动清理只处理 APT 下载缓存与旧 journal，**不会删除 VPS、natpool、`/var/lib/incus/disks`、Incus 镜像、Agent 配置或用户数据**。
          - `xnat` Host 菜单新增「清理 Host 系统空间」，系统盘低于安全阈值时在菜单顶部直接提示。
          - Host 安装器区分最低安装与建议长期运行配置：LXC 建议 8GiB+，KVM/混合建议 12GiB+。
          - Host 版本检查以 Host Agent 版本为主；仓库 Release 仅作为更新包信息，不再混淆为 Host 组件版本。
          - Host Agent v1.2.0 → v1.2.1 支持原地升级，保留 Agent Token、TLS、Incus、natpool、现有 VPS、端口和节点配置。

          升级现有 Host：

          ```bash
          xnat update 1.6.4
          ```
          EOF
          gh release create v1.6.4 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "XNAT v1.6.4" \
            --notes-file /tmp/release-notes.md

      - name: Verify formal release
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.6.4")"
          python3 - "$TARGET_SHA" "$data" <<'PY'
          import json, sys, subprocess
          target=sys.argv[1]
          d=json.loads(sys.argv[2])
          assert d['tag_name']=='v1.6.4'
          assert d['name']=='XNAT v1.6.4'
          assert d['draft'] is False
          assert d['prerelease'] is False
          tag=subprocess.check_output(['git','rev-list','-n','1','v1.6.4'], text=True).strip()
          if not tag:
              subprocess.run(['git','fetch','origin','tag','v1.6.4'], check=True)
              tag=subprocess.check_output(['git','rev-list','-n','1','v1.6.4'], text=True).strip()
          assert tag==target, (tag,target)
          print(d['html_url'])
          print('tag_target='+tag)
          PY

      - name: Remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v164.yml
          git config user.name "XNAT Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove v1.6.4 publisher"
          git push origin HEAD:main
