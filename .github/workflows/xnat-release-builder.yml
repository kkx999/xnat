name: XNAT release builder

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-release-1-0-2:
    if: github.head_ref == 'release/1.0.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/1.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare release patcher
        run: python scripts/repair-release-patcher.py

      - name: Apply release patches
        run: |
          python scripts/apply-release-1.0.2-panel.py
          python scripts/apply-release-1.0.2-agent.py

      - name: Assert UI assets unchanged
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- panel/app/templates panel/app/static)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi

      - name: Validate release
        run: |
          python scripts/check-release-1.0.2.py
          git diff --check

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'release: generate XNAT 1.0.2 source'
            git push origin HEAD:release/1.0.2
          fi
