name: Finalize v1.0.3 tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v1.0.3-tag.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Point v1.0.3 tag to clean release state
        run: |
          git tag -f v1.0.3 b1917a885c619fbc1d653b2aa296771e4ce6f9f0
          git push --force origin refs/tags/v1.0.3
