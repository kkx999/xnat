name: Publish XNAT v1.6.1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-v161]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tree
        shell: bash
        run: |
          test "$(cat VERSION)" = "1.6.1"
          test "$(cat panel/VERSION)" = "1.6.1"
          test "$(cat agent/VERSION)" = "1.2.0"
          python3 - <<'PY'
          import json
          m=json.load(open('release.json'))
          assert m['release_version']=='1.6.1'
          assert m['panel_version']=='1.6.1'
          assert m['agent_version']=='1.2.0'
          assert str(m['agent_api_version'])=='1'
          assert str(m['mobile_api_version'])=='1'
          PY
          test -s dist/xnat-panel-v1.6.1.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.6.1.sh
          test -s dist/xnat-bootstrap-host-v1.6.1.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -z "$(gh release view v1.6.1 --json tagName 2>/dev/null || true)" || { echo 'v1.6.1 already exists'; exit 1; }
          gh release create v1.6.1 \
            --target 28363f050386a2fb73d5a70ce62b42a29f66413f \
            --title "XNAT v1.6.1" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/xnat-panel-v1.6.1.zip \
            dist/xnat-host-agent-v1.2.0.zip \
            dist/xnat-bootstrap-panel-v1.6.1.sh \
            dist/xnat-bootstrap-host-v1.6.1.sh \
            dist/release.json \
            dist/RELEASE_NOTES.md \
            dist/SHA256SUMS.txt
      - name: Remove one-shot publisher
        shell: bash
        run: |
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/publish-v161.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git commit -m 'chore: remove v1.6.1 publisher'
          git push origin HEAD:main
