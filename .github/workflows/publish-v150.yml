name: Publish XNAT v1.5.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ contains(github.event.head_commit.message, '[publish-v150]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release tree
        shell: bash
        run: |
          test "$(cat VERSION)" = "1.5.0"
          test "$(cat panel/VERSION)" = "1.5.0"
          test "$(cat agent/VERSION)" = "1.2.0"
          test -s dist/xnat-panel-v1.5.0.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.5.0.sh
          test -s dist/xnat-bootstrap-host-v1.5.0.sh
          grep -q 'XNAT v1.5.0' dist/RELEASE_NOTES.md
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo 'v1.5.0 release already exists'
          else
            gh release create v1.5.0 \
              --target main \
              --title 'XNAT v1.5.0' \
              --notes-file dist/RELEASE_NOTES.md \
              dist/xnat-panel-v1.5.0.zip \
              dist/xnat-host-agent-v1.2.0.zip \
              dist/xnat-bootstrap-panel-v1.5.0.sh \
              dist/xnat-bootstrap-host-v1.5.0.sh \
              dist/release.json \
              dist/SHA256SUMS.txt \
              dist/RELEASE_NOTES.md
          fi
      - name: Remove one-shot publisher
        shell: bash
        run: |
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/publish-v150.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git commit -m 'chore: remove one-shot v1.5.0 publisher'
          git push origin HEAD:main
