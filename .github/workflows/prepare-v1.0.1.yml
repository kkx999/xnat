name: Prepare XNAT v1.0.1

on:
  push:
    branches:
      - fix/v1.0.1-uninstall
    paths:
      - .github/workflows/prepare-v1.0.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.1-uninstall
          fetch-depth: 0

      - name: Patch v1.0.1
        run: |
          set -Eeuo pipefail
          python3 .github/prepare-v1.0.1.py
          python3 .github/fix-check-v1.0.1.py
          sed -i 's/XNAT v1\.0\.0 Multi-Node/XNAT v1.0.1 Multi-Node/' panel/app/templates/base.html

      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-jinja2 python3-pip zip
          python3 -m pip install -r panel/requirements.txt

      - name: Run regression checks
        run: |
          set -Eeuo pipefail
          bash scripts/check.sh
          bash -n scripts/xnat scripts/upgrade-panel.sh scripts/build-release.sh

      - name: Build release assets
        run: |
          set -Eeuo pipefail
          bash scripts/build-release.sh
          test -f dist/xnat-panel-v1.0.1.zip
          test -f dist/xnat-host-agent-v1.0.0.zip
          test -f dist/xnat-bootstrap-panel-v1.0.1.sh
          test -f dist/xnat-bootstrap-host-v1.0.1.sh
          grep -q '"release_version": "1.0.1"' dist/release.json
          grep -q '"panel_version": "1.0.1"' dist/release.json
          grep -q '"agent_version": "1.0.0"' dist/release.json

      - name: Commit prepared release
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION panel/VERSION panel/app/__init__.py panel/app/main.py panel/app/templates/base.html release.json \
            scripts/xnat scripts/upgrade-panel.sh scripts/build-release.sh scripts/check.sh \
            README.md panel/README.md CHANGELOG.md dist
          git commit -m "XNAT v1.0.1: harden Panel uninstall"
          git push origin HEAD:fix/v1.0.1-uninstall
