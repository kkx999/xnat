name: XNAT v1.6.0 apply and validate
on:
  push:
    branches: [v1.6.0-mainwork]
permissions:
  contents: write
jobs:
  apply-validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.6.0-mainwork
          fetch-depth: 0
      - name: Apply v1.6.0 changes
        shell: bash
        run: |
          python3 -m py_compile scripts/release-v160-patch.py
          python3 scripts/release-v160-patch.py
      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check -r panel/requirements.txt -r agent/requirements.txt
      - name: Validate repository and capacity policy
        shell: bash
        run: |
          bash -n scripts/*.sh scripts/xnat scripts/xnat-firewall
          bash scripts/check.sh
          python3 - <<'PY'
          from pathlib import Path
          import json
          meta=json.loads(Path('release.json').read_text())
          assert Path('VERSION').read_text().strip() == '1.6.0'
          assert Path('panel/VERSION').read_text().strip() == '1.6.0'
          assert Path('agent/VERSION').read_text().strip() == '1.2.0'
          assert meta['release_version'] == '1.6.0' and meta['panel_version'] == '1.6.0'
          host=Path('scripts/install-host.sh').read_text()
          for token in ['debian:bookworm','debian:trixie','ubuntu:jammy','ubuntu:noble','ubuntu:resolute','ROOT_TOTAL_MIB','ROOT_AVAIL_MIB','Suites: ${INCUS_SUITE}']:
              assert token in host, token
          # User-reported 4.9G total / 3.9G available Host: LXC must pass disk policy and expose >=2GiB pool.
          total_mib=5017
          avail_mib=3994
          lxc_pool=max(0, avail_mib-1024)//1024
          assert total_mib >= 4608 and lxc_pool >= 1 and lxc_pool == 2
          assert total_mib < 6656  # KVM/hybrid remain unavailable on this size.
          print('v1.6.0 capacity smoke: ok')
          PY
      - name: Build and verify release assets
        shell: bash
        run: |
          bash scripts/build-release.sh
          test -s dist/xnat-panel-v1.6.0.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.6.0.sh
          test -s dist/xnat-bootstrap-host-v1.6.0.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Commit validated v1.6.0 tree
        shell: bash
        run: |
          find panel agent scripts -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -f scripts/release-v160-patch.py .github/workflows/xnat-v160-apply.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: XNAT v1.6.0 multi-OS Host capacity [v160-built]'
          git push origin HEAD:v1.6.0-mainwork
