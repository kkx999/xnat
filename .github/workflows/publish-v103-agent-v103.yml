name: Publish v1.0.3 Host Agent v1.0.3 hotfix

on:
  push:
    branches:
      - fix/v1.0.3-reinstall-backup
    paths:
      - .github/workflows/publish-v103-agent-v103.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG_TARGET: 80b0ea588752aa7e7ef6ae7aaa5b6398958f33de
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80b0ea588752aa7e7ef6ae7aaa5b6398958f33de
          fetch-depth: 0

      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check -q -r panel/requirements.txt -r agent/requirements.txt

      - name: Verify clean release tree and build assets
        run: |
          test "$(cat VERSION)" = "1.0.3"
          test "$(cat panel/VERSION)" = "1.0.3"
          test "$(cat agent/VERSION)" = "1.0.3"
          python3 - <<'PY'
          import json
          m=json.load(open('release.json'))
          assert m['release_version']=='1.0.3'
          assert m['panel_version']=='1.0.3'
          assert m['agent_version']=='1.0.3'
          assert str(m['agent_api_version'])=='2'
          assert str(m['mobile_api_version'])=='1'
          PY
          bash scripts/check.sh
          bash scripts/build-release.sh
          test -s dist/xnat-host-agent-v1.0.3.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Update v1.0.3 tag and formal Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v1.0.3 "$TAG_TARGET"
          git push --force origin refs/tags/v1.0.3
          gh release delete-asset v1.0.3 xnat-host-agent-v1.0.2.zip -y || true
          gh release upload v1.0.3 dist/release.json dist/RELEASE_NOTES.md dist/SHA256SUMS.txt dist/xnat-panel-v1.0.3.zip dist/xnat-host-agent-v1.0.3.zip dist/xnat-bootstrap-panel-v1.0.3.sh dist/xnat-bootstrap-host-v1.0.3.sh --clobber
          gh release edit v1.0.3 --target "$TAG_TARGET" --title 'XNAT v1.0.3' --notes-file dist/RELEASE_NOTES.md
          test "$(git rev-list -n 1 v1.0.3)" = "$TAG_TARGET"
          gh release view v1.0.3 --json tagName,name,isDraft,isPrerelease,targetCommitish,url,assets

      - name: Remove one-shot publisher from fix branch
        run: |
          git checkout -B fix/v1.0.3-reinstall-backup origin/fix/v1.0.3-reinstall-backup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v103-agent-v103.yml
          git commit -m 'chore: remove v1.0.3 Host Agent hotfix publisher'
          git push origin HEAD:fix/v1.0.3-reinstall-backup
