name: Prepare XNAT v1.0.0

on:
  push:
    branches:
      - release/v1.0.0-reset

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-reset
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r panel/requirements.txt -r agent/requirements.txt

      - name: Apply v1.0.0 baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def must_replace(text, old, new, label, count=None):
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f"{label}: expected {count} matches, found {found}")
              if found == 0:
                  raise SystemExit(f"{label}: old text not found")
              return text.replace(old, new)

          # Version baseline
          write("VERSION", "1.0.0\n")
          write("panel/VERSION", "1.0.0\n")
          write("agent/VERSION", "1.0.0\n")
          write("panel/app/__init__.py", '__version__ = "1.0.0"\n')
          write("agent/natvps_agent/__init__.py", '__version__ = "1.0.0"\n__api_version__ = "1"\n')

          agent_main = read("agent/natvps_agent/main.py")
          agent_main = must_replace(agent_main, 'AGENT_VERSION = "1.2.1"', 'AGENT_VERSION = "1.0.0"', "agent version", 1)
          write("agent/natvps_agent/main.py", agent_main)

          panel_main = read("panel/app/main.py")
          panel_main, n = re.subn(r'("version"\s*:\s*")1\.6\.3(")', r'\g<1>1.0.0\2', panel_main)
          if n != 1:
              raise SystemExit(f"panel API version: expected 1 replacement, found {n}")
          write("panel/app/main.py", panel_main)

          base = read("panel/app/templates/base.html")
          base = must_replace(base, "XNAT v1.6.3 Multi-Node", "XNAT v1.0.0 Multi-Node", "base visible version", 1)
          write("panel/app/templates/base.html", base)

          release = {
              "release_version": "1.0.0",
              "panel_version": "1.0.0",
              "agent_version": "1.0.0",
              "agent_api_version": "1",
              "supported_agent_api_versions": ["1"],
              "mobile_api_version": "1",
          }
          write("release.json", json.dumps(release, ensure_ascii=False, indent=2) + "\n")

          # Host installer
          p = "scripts/install-host.sh"
          s = read(p)
          s = must_replace(s,
              'local mode="$1" prefix total_min reserve min_pool warn_total requires_kvm="false"',
              'local mode="$1" prefix total_min reserve min_pool requires_kvm="false"',
              "host capacity locals", 1)
          s = must_replace(s,
              'lxc) prefix="LXC"; total_min=4608; reserve=2048; min_pool=1; warn_total=8192 ;;',
              'lxc) prefix="LXC"; total_min=8192; reserve=4096; min_pool=1 ;;',
              "LXC capacity rule", 1)
          s = must_replace(s,
              'kvm) prefix="KVM"; total_min=6656; reserve=3072; min_pool=4; warn_total=12288; requires_kvm="true" ;;',
              'kvm) prefix="KVM"; total_min=12288; reserve=6144; min_pool=4; requires_kvm="true" ;;',
              "KVM capacity rule", 1)
          s = must_replace(s,
              'hybrid) prefix="HYBRID"; total_min=6656; reserve=3072; min_pool=4; warn_total=12288; requires_kvm="true" ;;',
              'hybrid) prefix="HYBRID"; total_min=12288; reserve=6144; min_pool=4; requires_kvm="true" ;;',
              "hybrid capacity rule", 1)
          s = must_replace(s,
              'if (( pool_gb < min_pool )); then ok="false"; reason="${reason:+${reason}；}当前可用空间只能安全提供 ${pool_gb}GiB natpool，至少需要 ${min_pool}GiB"; fi',
              'if (( pool_gb < min_pool )); then ok="false"; reason="${reason:+${reason}；}安装 XNAT 后当前最多只能给小鸡 ${pool_gb}GiB 硬盘，至少需要 ${min_pool}GiB"; fi',
              "capacity failure wording", 1)
          s = must_replace(s, '  printf -v "${prefix}_WARN_TOTAL_MIB" \'%s\' "$warn_total"\n', '', "remove warn total", 1)

          s = must_replace(s,
              'VIRTUALIZATION_MODES_JSON=\'["lxc"]\'; VIRTUALIZATION_LABEL="LXC"; MAX_SAFE_GB="${LXC_POOL_GB}"; SYSTEM_RESERVE_MIB="${LXC_RESERVE_MIB}"; MIN_POOL_GB="${LXC_MIN_POOL_GB}"; WARN_TOTAL_MIB="${LXC_WARN_TOTAL_MIB}"',
              'VIRTUALIZATION_MODES_JSON=\'["lxc"]\'; VIRTUALIZATION_LABEL="LXC"; MAX_SAFE_GB="${LXC_POOL_GB}"; SYSTEM_RESERVE_MIB="${LXC_RESERVE_MIB}"; MIN_POOL_GB="${LXC_MIN_POOL_GB}"',
              "LXC selected rule", 1)
          s = must_replace(s,
              'VIRTUALIZATION_MODES_JSON=\'["kvm"]\'; VIRTUALIZATION_LABEL="KVM"; MAX_SAFE_GB="${KVM_POOL_GB}"; SYSTEM_RESERVE_MIB="${KVM_RESERVE_MIB}"; MIN_POOL_GB="${KVM_MIN_POOL_GB}"; WARN_TOTAL_MIB="${KVM_WARN_TOTAL_MIB}"',
              'VIRTUALIZATION_MODES_JSON=\'["kvm"]\'; VIRTUALIZATION_LABEL="KVM"; MAX_SAFE_GB="${KVM_POOL_GB}"; SYSTEM_RESERVE_MIB="${KVM_RESERVE_MIB}"; MIN_POOL_GB="${KVM_MIN_POOL_GB}"',
              "KVM selected rule", 1)
          s = must_replace(s,
              'VIRTUALIZATION_MODES_JSON=\'["lxc","kvm"]\'; VIRTUALIZATION_LABEL="LXC + KVM"; MAX_SAFE_GB="${HYBRID_POOL_GB}"; SYSTEM_RESERVE_MIB="${HYBRID_RESERVE_MIB}"; MIN_POOL_GB="${HYBRID_MIN_POOL_GB}"; WARN_TOTAL_MIB="${HYBRID_WARN_TOTAL_MIB}"',
              'VIRTUALIZATION_MODES_JSON=\'["lxc","kvm"]\'; VIRTUALIZATION_LABEL="LXC + KVM"; MAX_SAFE_GB="${HYBRID_POOL_GB}"; SYSTEM_RESERVE_MIB="${HYBRID_RESERVE_MIB}"; MIN_POOL_GB="${HYBRID_MIN_POOL_GB}"',
              "hybrid selected rule", 1)

          for old, new, label, count in [
              ('echo "     最低安装：1C / 1GB / 4.5GiB 总硬盘"', 'echo "     最低配置：1C / 1GB / 8GiB 总硬盘"', "LXC minimum copy", 1),
              ('    echo "     建议配置：1C / 1GB / 8GiB+ 总硬盘"\n', '', "remove LXC recommendation", 1),
              ('echo "     当前预计可用于 natpool：${LXC_POOL_GB} GiB（基础依赖安装后，继续为 Host 系统保留约 2GiB）"', 'echo "     当前最多可给小鸡：${LXC_POOL_GB} GiB"', "LXC guest copy", 1),
              ('echo "     最低安装：1C / 1GB / 6.5GiB 总硬盘 + /dev/kvm"', 'echo "     最低配置：1C / 1GB / 12GiB 总硬盘 + /dev/kvm"', "KVM minimum copy", 2),
              ('    echo "     建议配置：2C / 2GB / 12GiB+ 总硬盘"\n', '', "remove KVM recommendations", 2),
              ('echo "     当前预计可用于 natpool：${KVM_POOL_GB} GiB（基础依赖安装后，继续为 Host 系统保留约 3GiB）"', 'echo "     当前最多可给小鸡：${KVM_POOL_GB} GiB"', "KVM guest copy", 1),
              ('echo "     当前预计可用于 natpool：${HYBRID_POOL_GB} GiB（基础依赖安装后，继续为 Host 系统保留约 3GiB）"', 'echo "     当前最多可给小鸡：${HYBRID_POOL_GB} GiB"', "hybrid guest copy", 1),
          ]:
              s = must_replace(s, old, new, label, count)

          old_env = '''  python3 - "${ROOT_TOTAL_MIB}" "${ROOT_USED_MIB}" "${ROOT_AVAIL_MIB}" "${SYSTEM_RESERVE_MIB}" <<'PY_RES'
          import sys
          total, used, avail, reserve = map(int, sys.argv[1:])
          print(f"  总硬盘：        {total/1024:.2f} GiB")
          print(f"  当前已用：      {used/1024:.2f} GiB")
          print(f"  当前可用：      {avail/1024:.2f} GiB")
          print(f"  系统/XNAT长期预留：约 {reserve/1024:.2f} GiB（不会分给 natpool）")
          PY_RES
            [[ "${VIRTUALIZATION_MODE}" == "lxc" ]] || echo "  /dev/kvm：      ✓ 可用"
            echo "  natpool 可分配：${MAX_SAFE_GB} GiB"
            if (( ROOT_TOTAL_MIB < WARN_TOTAL_MIB || MAX_SAFE_GB == MIN_POOL_GB )); then
              echo "  [WARN] 当前 Host 仅达到最低安装区间，建议只用于测试或少量轻量实例。"
              if [[ "${VIRTUALIZATION_MODE}" == "lxc" ]]; then
                echo "  [WARN] 长期运行建议使用 8GiB+ 系统盘，并持续保留 Host 系统盘可用空间。"
              else
                echo "  [WARN] 长期运行建议使用 12GiB+ 系统盘，并持续保留 Host 系统盘可用空间。"
              fi
            fi
          '''
          old_env = textwrap.dedent(old_env)
          new_env = '''  python3 - "${ROOT_TOTAL_MIB}" "${ROOT_USED_MIB}" "${ROOT_AVAIL_MIB}" <<'PY_RES'
          import sys
          total, used, avail = map(int, sys.argv[1:])
          print(f"  总硬盘：        {total/1024:.2f} GiB")
          print(f"  当前已用：      {used/1024:.2f} GiB")
          print(f"  当前可用：      {avail/1024:.2f} GiB")
          PY_RES
            [[ "${VIRTUALIZATION_MODE}" == "lxc" ]] || echo "  /dev/kvm：      ✓ 可用"
            echo "  最多可给小鸡：  ${MAX_SAFE_GB} GiB"
            if (( MAX_SAFE_GB == MIN_POOL_GB )); then
              echo "  [WARN] 当前 Host 仅达到最低可用区间，建议只运行少量轻量小鸡。"
            fi
          '''
          new_env = textwrap.dedent(new_env)
          s = must_replace(s, old_env, new_env, "environment summary", 1)

          old_storage = '''    echo "已按当前真实可用空间自动计算 natpool，普通安装直接回车即可。"
              python3 - "${ROOT_AVAIL_MIB}" "${SYSTEM_RESERVE_MIB}" <<'PY_POOL'
          import sys
          avail, reserve = map(int, sys.argv[1:])
          print(f"  当前可用硬盘：       {avail/1024:.2f} GiB")
          print(f"  Host 长期运行保留：   约 {reserve/1024:.2f} GiB（natpool 满载后仍保留）")
          PY_POOL
              echo "  natpool 推荐值：      ${RECOMMENDED_GB} GiB"
              echo "  natpool 最低值：      ${MIN_POOL_GB} GiB"
              read -r -p "natpool 大小 [${RECOMMENDED_GB}]: " NATPOOL_GB
          '''
          old_storage = textwrap.dedent(old_storage)
          new_storage = '''    echo "XNAT 已自动为 Host 保留稳定运行空间，你只需要决定给小鸡多少硬盘。"
              echo "  当前最多可以给小鸡：${MAX_SAFE_GB} GiB"
              echo "  这部分是所有小鸡共享的总硬盘。"
              echo "  例如：5 GiB 可以分配成 5 台 × 1 GiB，或按其他组合使用。"
              read -r -p "请输入给小鸡使用的总硬盘 [${RECOMMENDED_GB}]: " NATPOOL_GB
          '''
          new_storage = textwrap.dedent(new_storage)
          s = must_replace(s, old_storage, new_storage, "guest disk prompt", 1)

          s = must_replace(s,
              '[[ "${NATPOOL_GB}" =~ ^[0-9]+$ ]] || die "NATPOOL_GB 必须是整数 GiB"',
              '[[ "${NATPOOL_GB}" =~ ^[0-9]+$ ]] || die "小鸡总硬盘必须是整数 GiB"',
              "guest disk integer validation", 1)
          s = must_replace(s,
              '(( NATPOOL_GB >= MIN_POOL_GB )) || die "${VIRTUALIZATION_LABEL} 模式 natpool 至少需要 ${MIN_POOL_GB}GiB"',
              '(( NATPOOL_GB >= MIN_POOL_GB )) || die "${VIRTUALIZATION_LABEL} 模式至少需要给小鸡 ${MIN_POOL_GB}GiB 总硬盘"',
              "guest disk minimum validation", 1)
          s = must_replace(s,
              '(( NATPOOL_GB <= MAX_SAFE_GB )) || die "natpool=${NATPOOL_GB}GiB 超过当前安全上限 ${MAX_SAFE_GB}GiB；请保留系统/XNAT运行空间"',
              '(( NATPOOL_GB <= MAX_SAFE_GB )) || die "你选择了 ${NATPOOL_GB}GiB，但当前最多只能给小鸡 ${MAX_SAFE_GB}GiB；XNAT 已自动保留 Host 稳定运行空间"',
              "guest disk maximum validation", 1)
          s = must_replace(s,
              'die "磁盘空间在安装过程中发生变化：当前最多只能安全创建 ${CURRENT_MAX_SAFE_GB}GiB natpool；请减小 natpool 或扩容 Host 系统盘"',
              'die "磁盘空间在安装过程中发生变化：当前最多只能给小鸡 ${CURRENT_MAX_SAFE_GB}GiB；请减小小鸡总硬盘或扩容 Host 系统盘"',
              "guest disk recheck wording", 1)
          s = must_replace(s,
              'die "natpool 满载后 Host 系统预留不足：预计仅剩 ${PROJECTED_HOST_FREE_MIB}MiB，至少需保留 ${SYSTEM_RESERVE_MIB}MiB"',
              'die "当前磁盘空间不足以保证 Host 稳定运行：预计仅剩 ${PROJECTED_HOST_FREE_MIB}MiB；请减小小鸡总硬盘或扩容 Host 系统盘"',
              "reserve fail wording", 1)
          s = must_replace(s,
              'Storage: ${POOL_NAME} / LVM Thin / ${NATPOOL_GB}GiB',
              'Guest Disk Total: ${NATPOOL_GB}GiB (shared by all VPS)',
              "credentials wording", 1)
          s = must_replace(s,
              'echo "Virtualization: ${VIRTUALIZATION_LABEL}"',
              'echo "Virtualization: ${VIRTUALIZATION_LABEL}"\necho "小鸡总硬盘: ${NATPOOL_GB} GiB（所有小鸡共享）"',
              "final guest summary", 1)

          for forbidden in [
              "当前预计可用于 natpool",
              "natpool 推荐值",
              "natpool 最低值",
              "natpool 大小 [",
              "系统/XNAT长期预留",
              "Host 长期运行保留",
          ]:
              if forbidden in s:
                  raise SystemExit(f"old Host installer wording remains: {forbidden}")
          write(p, s)

          # User-facing updater/status copy: keep release metadata internally, hide it.
          p = "scripts/xnat"
          x = read(p)
          x = must_replace(x,
              '  [[ "$role" == panel && "$release" != unknown ]] && printf \'Release    v%s\\n\' "$release"\n',
              '',
              "menu release label", 1)
          x = must_replace(x,
              '  printf \'目标 XNAT Release v%s\\n\' "$release"\n',
              '',
              "preflight release label", 1)

          old_panel_check = '''  printf '组件             %s
          ' "$(component_label "$role")"
            printf '当前组件版本     v%s
          ' "$current"
            [[ "$current_rel" != unknown ]] && printf '当前 XNAT Release v%s
          ' "$current_rel"
            printf '最新 XNAT Release v%s
          ' "$release"
            printf 'Release 组件版本 v%s
          ' "$target"
          '''
          old_panel_check = textwrap.dedent(old_panel_check)
          new_panel_check = '''  printf '组件             %s
          ' "$(component_label "$role")"
            printf '当前版本         v%s
          ' "$current"
            printf '最新版本         v%s
          ' "$target"
          '''
          new_panel_check = textwrap.dedent(new_panel_check)
          x = must_replace(x, old_panel_check, new_panel_check, "panel update check display", 1)

          for old, new, label in [
              ('ui_notice "Host Agent 已是最新；有新的 Host 管理脚本可同步（更新包 XNAT v${release}）"',
               'ui_notice "Host Agent 已是最新；有新的 Host 管理组件可同步"',
               "host check notice one"),
              ('ui_notice "Host Agent 已是最新；Host 管理脚本可从更新包 v${current_rel} 同步到 v${release}"',
               'ui_notice "Host Agent 已是最新；有新的 Host 管理组件可同步"',
               "host check notice two"),
              ('ui_notice "组件版本相同，但当前 Release 记录缺失；可同步到 Release v${release} 的管理脚本与发布文件"',
               'ui_notice "Panel 已是最新；有新的管理组件可同步"',
               "panel check notice one"),
              ('ui_notice "组件版本相同，但当前 Release 为 v${current_rel}；可同步到 Release v${release} 的管理脚本与发布文件"',
               'ui_notice "Panel 已是最新；有新的管理组件可同步"',
               "panel check notice two"),
              ('ui_notice "当前组件版本高于该 Release"',
               'ui_notice "当前组件版本高于最新正式版本"',
               "panel higher wording"),
          ]:
              x = must_replace(x, old, new, label, 1)

          old_update_display = '''  echo "组件：$(component_label "$role")"
            if [[ "$role" == host ]]; then
              echo "当前 Host Agent：v${current}"
              echo "目标 Host Agent：v${target}"
              echo "更新包：XNAT v${release}"
            else
              echo "当前组件：v${current}"
              [[ "$current_rel" != unknown ]] && echo "当前 Release：v${current_rel}"
              echo "目标 Release：v${release}"
              echo "目标组件：v${target}"
            fi
          '''
          old_update_display = textwrap.dedent(old_update_display)
          new_update_display = '''  echo "组件：$(component_label "$role")"
            echo "当前版本：v${current}"
            echo "目标版本：v${target}"
          '''
          new_update_display = textwrap.dedent(new_update_display)
          x = must_replace(x, old_update_display, new_update_display, "update display", 1)

          for old, new, label in [
              ('ui_success "当前组件与 Release 均无需更新"', 'ui_success "当前组件已是最新版本"', "already latest"),
              ('die "目标 XNAT Release 低于当前 Release。若确需降级，请设置 XNAT_ALLOW_DOWNGRADE=1。"',
               'die "目标管理版本低于当前已同步版本。若确需降级，请设置 XNAT_ALLOW_DOWNGRADE=1。"', "downgrade wording"),
              ('ui_notice "Host Agent 版本保持 v${target}，仅同步更新包 v${release} 中的 Host 管理脚本"',
               'ui_notice "Host Agent 版本保持 v${target}，仅同步最新 Host 管理组件"', "host same-version sync"),
              ('ui_notice "组件版本保持 v${target}，将同步 Release v${release} 的管理脚本与发布文件"',
               'ui_notice "Panel 版本保持 v${target}，仅同步最新管理组件"', "panel same-version sync"),
              ('echo "正在下载并验证 XNAT Release v${release}..."',
               'echo "正在下载并验证 XNAT 更新包..."', "download wording"),
              ('printf \'%b\' "${XNAT_YELLOW}${XNAT_BOLD}▶${XNAT_RESET} 确认同步 Host 管理脚本（更新包 v${release}）？[y/N]: "',
               'printf \'%b\' "${XNAT_YELLOW}${XNAT_BOLD}▶${XNAT_RESET} 确认同步 Host 管理组件？[y/N]: "', "host confirmation"),
              ('printf \'%b\' "${XNAT_YELLOW}${XNAT_BOLD}▶${XNAT_RESET} 确认同步 $(component_label "$role") 到 XNAT Release v${release}？[y/N]: "',
               'printf \'%b\' "${XNAT_YELLOW}${XNAT_BOLD}▶${XNAT_RESET} 确认同步 $(component_label "$role") 管理组件？[y/N]: "', "panel confirmation"),
              ('ui_success "更新完成：Host Agent v${installed}（更新包 v${release}）"',
               'ui_success "更新完成：Host Agent v${installed}"', "host completion"),
              ('ui_success "更新完成：$(component_label "$role") v${installed} / XNAT Release v${release}"',
               'ui_success "更新完成：$(component_label "$role") v${installed}"', "panel completion"),
              ('echo "组件：$(component_label "$role") v$(current_version "$role") / Release v$(current_release)"',
               'echo "组件：$(component_label "$role") v$(current_version "$role")"', "doctor release"),
              ('echo "XNAT Release: $(current_release)"', 'echo "Version: $(current_version "$role")"', "diagnostic release"),
          ]:
              x = must_replace(x, old, new, label, 1)

          x = x.replace("无法解析 GitHub 最新正式 Release", "无法解析 GitHub 最新正式版本")
          x = x.replace("Release 未声明 supported_agent_api_versions", "版本信息未声明 supported_agent_api_versions")
          x = x.replace("不在 Release v${release} 支持范围", "不在目标版本支持范围")
          x = x.replace("Release 缺少 Agent API 版本", "版本信息缺少 Agent API 版本")
          x = x.replace("Release 源码与升级脚本完整性检查", "升级源码与脚本完整性检查")
          x = x.replace("Release 源码完整性检查失败", "升级源码完整性检查失败")
          x = x.replace("Release v${release} 缺少组件版本信息", "目标版本缺少组件版本信息")
          x = x.replace("Release 版本格式无效", "版本格式无效")
          x = x.replace("Release v${release} 的组件版本无效", "目标组件版本无效")
          x = x.replace("Release", "版本包")
          write(p, x)

          # Tests
          p = "scripts/check.sh"
          c = read(p)
          c = c.replace("grep -q '组件版本相同，但当前 Release' scripts/xnat",
                        "grep -q '有新的管理组件可同步' scripts/xnat")
          c = c.replace("total_min=4608; reserve=2048; min_pool=1",
                        "total_min=8192; reserve=4096; min_pool=1")
          c = c.replace("total_min=6656; reserve=3072; min_pool=4",
                        "total_min=12288; reserve=6144; min_pool=4")
          c = c.replace("assert 'natpool 满载后 Host 系统预留不足' in s",
                        "assert '当前磁盘空间不足以保证 Host 稳定运行' in s")
          c = c.replace("assert '系统/XNAT长期预留' in s and 'Host 长期运行保留' in s",
                        "assert '当前最多可给小鸡' in s and '请输入给小鸡使用的总硬盘' in s")
          c = c.replace("print('v1.6.5 post-dependency natpool planning contract: ok')",
                        "print('v1.0.0 simplified Host storage planning contract: ok')")
          c += r'''

          # v1.0.0 public baseline / simplified operator UX.
          python3 - <<'PYV100'
          from pathlib import Path
          import json
          root=Path('.')
