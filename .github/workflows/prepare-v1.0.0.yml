          find "$DIST" -maxdepth 1 -type f -delete

          bash "$ROOT/scripts/check.sh"

          (
            cd panel
            zip -Dqr "$DIST/xnat-panel-v${PANEL_VERSION}.zip" . \
              -x '.env' '.venv/*' 'data/*' '__pycache__/*' '*.pyc'
