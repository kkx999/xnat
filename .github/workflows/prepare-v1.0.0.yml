              "xnat-bootstrap-panel-v${RELEASE_VERSION}.sh" \
              "xnat-bootstrap-host-v${RELEASE_VERSION}.sh" \
              release.json \
              RELEASE_NOTES.md \
              > SHA256SUMS.txt
          )

          echo "Release assets created in: $DIST"
          cat "$DIST/SHA256SUMS.txt"
          ''')

          print("v1.0.0 patch applied")
          PY

      - name: Full regression checks
