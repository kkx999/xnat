          set -Eeuo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          cd "$ROOT"

          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PANEL_VERSION="$(tr -d '[:space:]' < panel/VERSION)"
          AGENT_VERSION="$(tr -d '[:space:]' < agent/VERSION)"
          DIST="$ROOT/dist"

