          old_h3_start = d.index("# 7. Host 安装第 3 步：natpool")
          old_h3_end = d.index("# 7. 为什么 Host 安装时不再设置 NAT 端口池")
          new_h3 = '''# 7. Host 安装第 3 步：小鸡总硬盘

          XNAT 会在 Incus、LVM、Python 与 Host Agent Runtime 安装完成后重新读取真实剩余空间，并自动为 Host 本身保留稳定运行空间。

          普通安装只需要填写：

          ```text
          当前最多可以给小鸡：5 GiB
          这部分是所有小鸡共享的总硬盘。
          例如：5 GiB 可以分配成 5 台 × 1 GiB，或按其他组合使用。

          请输入给小鸡使用的总硬盘 [5]:
          ```

          用户不需要计算系统预留，也不需要理解底层 LVM Thin 的 `natpool`。底层仍由 XNAT 自动创建和管理存储池。

          当前安全规则：

          ```text
          LXC：
            最低 Host 配置 1C / 1GB / 8GiB
