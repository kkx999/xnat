name: Publish XNAT v1.6.3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tree
        shell: bash
        run: |
          test "$(cat VERSION)" = "1.6.3"
          test "$(cat panel/VERSION)" = "1.6.3"
          test "$(cat agent/VERSION)" = "1.2.0"
          git cat-file -e 1bdb37ef58063859dd0cd6bdc74753cc1d3a1154^{commit}
          test -s dist/xnat-panel-v1.6.3.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.6.3.sh
          test -s dist/xnat-bootstrap-host-v1.6.3.sh
          test -s dist/release.json
          test -s dist/RELEASE_NOTES.md
          test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.6.3 \
            --target 1bdb37ef58063859dd0cd6bdc74753cc1d3a1154 \
            --title "XNAT v1.6.3" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/release.json \
            dist/RELEASE_NOTES.md \
            dist/SHA256SUMS.txt \
            dist/xnat-bootstrap-host-v1.6.3.sh \
            dist/xnat-bootstrap-panel-v1.6.3.sh \
            dist/xnat-host-agent-v1.2.0.zip \
            dist/xnat-panel-v1.6.3.zip
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm -f .github/workflows/publish-v163.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove v1.6.3 one-shot publisher'
          git push origin HEAD:main
