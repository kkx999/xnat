name: Validate XNAT v1.0.0

on:
  push:
    branches:
      - release/v1.0.0-reset

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r panel/requirements.txt -r agent/requirements.txt

      - name: Repository regression checks
        run: bash scripts/check.sh

      - name: Build release assets
        run: bash scripts/build-release.sh

      - name: Verify v1.0.0 release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          assert (root/'VERSION').read_text().strip() == '1.0.0'
          assert (root/'panel/VERSION').read_text().strip() == '1.0.0'
          assert (root/'agent/VERSION').read_text().strip() == '1.0.0'
          meta = json.loads((root/'release.json').read_text())
          assert meta['release_version'] == '1.0.0'
          assert meta['panel_version'] == '1.0.0'
          assert meta['agent_version'] == '1.0.0'
          assert str(meta['agent_api_version']) == '1'
          assert str(meta['mobile_api_version']) == '1'
          readme = (root/'README.md').read_text()
          assert '当前正式版本：v1.0.0' in readme
          assert 'XNAT 能做什么' in readme
          assert '适合的部署场景' in readme
          for name in [
              'xnat-panel-v1.0.0.zip',
              'xnat-host-agent-v1.0.0.zip',
              'xnat-bootstrap-panel-v1.0.0.sh',
              'xnat-bootstrap-host-v1.0.0.sh',
              'release.json',
              'RELEASE_NOTES.md',
              'SHA256SUMS.txt',
          ]:
              assert (root/'dist'/name).is_file(), name
          print('v1.0.0 final release validation: ok')
          PY
