name: Align remaining v1.0.0 regression guards

on:
  push:
    branches:
      - release/v1.0.0-reset

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-reset
      - name: Align remaining baseline assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check.sh')
          s=p.read_text()
          old="assert f'当前正式版本：XNAT v{release}' in readme, 'formal release version must be documented'"
          new="assert f'当前正式版本：v{release}' in readme, 'formal release version must be documented'"
          if old not in s:
              raise SystemExit('expected formal release README assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/fix-v1.0.0-check-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check.sh .github/workflows/fix-v1.0.0-check-v2.yml
          git commit -m "test: align remaining v1.0.0 baseline guards"
          git push origin HEAD:release/v1.0.0-reset
