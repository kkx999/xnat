name: Finalize XNAT v1.0.1

on:
  push:
    branches:
      - fix/v1.0.1-uninstall
    paths:
      - .github/workflows/finalize-v1.0.1.yml

concurrency:
  group: finalize-xnat-v1.0.1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.1-uninstall
          fetch-depth: 0

      - name: Apply final hardening
        run: |
          set -Eeuo pipefail
          python3 .github/finalize-v1.0.1.py

      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-jinja2 python3-pip zip
          python3 -m pip install -r panel/requirements.txt

      - name: Run full regression checks
        run: |
          set -Eeuo pipefail
          bash scripts/check.sh
          bash -n scripts/xnat scripts/upgrade-panel.sh scripts/build-release.sh

      - name: Rebuild release assets
        run: |
          set -Eeuo pipefail
          bash scripts/build-release.sh
          test -f dist/xnat-panel-v1.0.1.zip
          test -f dist/xnat-host-agent-v1.0.0.zip
          test -f dist/xnat-bootstrap-panel-v1.0.1.sh
          test -f dist/xnat-bootstrap-host-v1.0.1.sh

      - name: Commit final release tree
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/xnat scripts/check.sh dist
          git commit -m "fix: complete Panel uninstall cleanup"
          git push origin HEAD:fix/v1.0.1-uninstall
