name: Publish XNAT v1.6.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ contains(github.event.head_commit.message, '[publish-v160]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tree
        shell: bash
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "1.6.0"
          test "$(tr -d '[:space:]' < panel/VERSION)" = "1.6.0"
          test "$(tr -d '[:space:]' < agent/VERSION)" = "1.2.0"
          test -s dist/xnat-panel-v1.6.0.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.6.0.sh
          test -s dist/xnat-bootstrap-host-v1.6.0.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.6.0 >/dev/null 2>&1; then
            echo "v1.6.0 already exists; refusing duplicate publish" >&2
            exit 1
          fi
          gh release create v1.6.0 \
            --target 33d9bfe29faa9643695bab43518bcd5b8e5bcdc9 \
            --title "XNAT v1.6.0" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/xnat-panel-v1.6.0.zip \
            dist/xnat-host-agent-v1.2.0.zip \
            dist/xnat-bootstrap-panel-v1.6.0.sh \
            dist/xnat-bootstrap-host-v1.6.0.sh \
            dist/release.json \
            dist/SHA256SUMS.txt \
            dist/RELEASE_NOTES.md
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm -f .github/workflows/publish-v160.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove v1.6.0 one-shot publisher [skip ci]'
          git push origin HEAD:main
