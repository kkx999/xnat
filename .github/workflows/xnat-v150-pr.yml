name: XNAT v1.5.0 apply on PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.5.0
          fetch-depth: 0
      - name: Apply staged patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/xnat-v150-maintenance.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(src) if "python3 <<'PY'" in x)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          lines=[line[10:] if line.startswith('          ') else line for line in src[start:end]]
          Path('/tmp/xnat-v150-patch.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/xnat-v150-patch.py
      - name: Check
        run: |
          python3 -m compileall -q panel/app agent/natvps_agent
          bash -n scripts/install-host.sh
          bash -n scripts/upgrade-panel.sh
          bash -n scripts/upgrade-host-agent.sh
          grep -q 'MIN_FREE_MIB=4608' scripts/install-host.sh
          grep -q 'MIN_FREE_MIB=6656' scripts/install-host.sh
          grep -q 'images:alpine/3.24' panel/app/main.py
          grep -q 'apk add --no-cache openssh' agent/natvps_agent/main.py
      - name: Commit result
        run: |
          rm -rf .github/workflows
          rmdir .github 2>/dev/null || true
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'XNAT v1.5.0 low-resource hosts and Alpine [xnat-v150-applied]'
          git push origin HEAD:release/v1.5.0
