name: 发布 XNAT v1.0.3 元数据热修复

on:
  push:
    branches:
      - release/1.0.2
    paths:
      - .github/workflows/publish-v1.0.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出 main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 安装检查依赖
        run: python3 -m pip install --disable-pip-version-check jinja2

      - name: 校正 v1.0.3 文档与发布脚本
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          s = s.replace('**当前正式版本：v1.0.2**', '**当前正式版本：v1.0.3**', 1)
          old_note = '> v1.0.2 是一次稳定性、安全性与一致性更新。重点完善了开通幂等、任务原子抢占、Host 端口租约、Agent API 2 防重放、TLS 指纹校验、重装失败保护、镜像最低磁盘校验和最小化系统 SSH 兼容性，同时保持现有 Web UI 与主要交互不变。'
          hotfix_note = '> v1.0.3 是版本元数据热修复：Panel 仍为 v1.0.2、Host Agent 仍为 v1.0.1、Agent API 仍为 v2、Mobile API 仍为 v1。本次只修正 v1.0.2 发布包中的 Host Agent 版本标识和 `xnat` 更新识别，不修改 VPS、Incus、NAT、Panel UI 或业务逻辑。'
          if hotfix_note not in s:
              s = s.replace(old_note, hotfix_note + '\n\n' + old_note, 1)
          anchor = '## v1.0.2 更新'
          section = '''## v1.0.3 热修复

v1.0.3 仅修正 v1.0.2 的 Host Agent 发布元数据，不改变组件业务版本：

- Panel 保持 v1.0.2；Host Agent 保持 v1.0.1；Agent API 保持 v2；Mobile API 保持 v1。
- 修正 `agent/VERSION`、`agent/API_VERSION` 与 `agent/natvps_agent/__init__.py`，与实际运行的 Agent v1.0.1 / API v2 保持一致。
- 修复 Host 更新成功后 `xnat` 仍显示 v1.0.0 / Agent API v1 的问题。
- 已执行过 v1.0.2 Host 更新但仍显示旧版本的节点，在 Panel 已为 v1.0.2 的前提下，再执行一次 `XNAT_ALLOW_AGENT_API_CHANGE=1 xnat` 并进入 Host Agent 更新即可同步正确元数据。
- 不修改 Web UI、页面布局、视觉风格、VPS、Incus、NAT 或现有业务交互。
'''
          if '## v1.0.3 热修复' not in s:
              s = s.replace(anchor, section + '\n---\n\n' + anchor, 1)
          readme.write_text(s, encoding='utf-8')

          p = Path('scripts/build-release.sh')
          b = p.read_text(encoding='utf-8')
          if 'AGENT_API_VERSION=' not in b:
              b = b.replace('AGENT_VERSION="$(tr -d \'[:space:]\' < agent/VERSION)"\n', 'AGENT_VERSION="$(tr -d \'[:space:]\' < agent/VERSION)"\nAGENT_API_VERSION="$(tr -d \'[:space:]\' < agent/API_VERSION)"\n', 1)
          start = 'cat > "$DIST/RELEASE_NOTES.md" <<EOF_NOTES\n'
          end = '\nEOF_NOTES\n'
          i = b.index(start) + len(start)
          j = b.index(end, i)
          notes = '''# XNAT v${RELEASE_VERSION}

版本元数据热修复。

- Panel：v${PANEL_VERSION}
- Host Agent：v${AGENT_VERSION}
- Agent API：v${AGENT_API_VERSION}
- Mobile API：v1
- 修复 Host Agent 发布元数据与实际运行版本不一致的问题
- 修复 `xnat` 更新完成后仍显示旧 Host Agent / Agent API 版本的问题
- 不修改 VPS、Incus、NAT、Panel UI、页面布局或现有业务逻辑

**由 𝐍𝐀𝐌𝐄𝐋𝐄𝐒𝐒 和 GPT 倾力打造**'''
          b = b[:i] + notes + b[j:]
          p.write_text(b, encoding='utf-8')
          PY

      - name: 验证版本一致性与源码
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = '1.0.3'
          test "$(tr -d '[:space:]' < panel/VERSION)" = '1.0.2'
          test "$(tr -d '[:space:]' < agent/VERSION)" = '1.0.1'
          test "$(tr -d '[:space:]' < agent/API_VERSION)" = '2'
          grep -Fxq '__version__ = "1.0.1"' agent/natvps_agent/__init__.py
          grep -Fxq '__api_version__ = "2"' agent/natvps_agent/__init__.py
          grep -Fq 'AGENT_VERSION = "1.0.1"' agent/natvps_agent/main.py
          grep -Fq 'AGENT_API_VERSION = "2"' agent/natvps_agent/main.py
          bash scripts/check.sh

      - name: 提交热修复文档
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add README.md CHANGELOG.md VERSION release.json agent/VERSION agent/API_VERSION agent/natvps_agent/__init__.py scripts/build-release.sh
          if ! git diff --cached --quiet; then
            git commit -m 'release: XNAT v1.0.3 元数据热修复'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 构建并校验发布包
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-release.sh
          test -f dist/xnat-host-agent-v1.0.1.zip
          test -f dist/xnat-panel-v1.0.2.zip
          grep -q 'Agent API：v2' dist/RELEASE_NOTES.md
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: 创建 v1.0.3 Tag 与 Release
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.0.3 >/dev/null; then
            test "$(git rev-list -n 1 v1.0.3)" = "$RELEASE_SHA"
          else
            git tag -a v1.0.3 "$RELEASE_SHA" -m 'XNAT v1.0.3'
            git push origin refs/tags/v1.0.3
          fi

          cat > /tmp/notes.md <<'EOF'
          # XNAT v1.0.3

          Host Agent 发布元数据热修复。

          - Panel：v1.0.2
          - Host Agent：v1.0.1
          - Agent API：v2
          - Mobile API：v1
          - 修复 v1.0.2 发布包中 Host Agent 版本元数据未同步，导致更新成功后 `xnat` 仍显示 v1.0.0 / Agent API v1 的问题
          - 实际 Agent 业务代码仍为 v1.0.1 / Agent API v2，本次不修改 VPS、Incus、NAT、Panel UI 或现有业务逻辑

          ## 已更新过 v1.0.2 但仍显示旧版本的 Host

          确认 Panel 已升级到 v1.0.2 后，在 Host 执行：

          ```bash
          XNAT_ALLOW_AGENT_API_CHANGE=1 xnat
          ```

          然后重新进入 **更新 → Host Agent 更新**。完成后应显示 Host Agent v1.0.1 / Agent API v2。

          **由 𝐍𝐀𝐌𝐄𝐋𝐄𝐒𝐒 和 GPT 倾力打造**
          EOF

          gh release create v1.0.3 \
            dist/xnat-panel-v1.0.2.zip \
            dist/xnat-host-agent-v1.0.1.zip \
            dist/xnat-bootstrap-panel-v1.0.3.sh \
            dist/xnat-bootstrap-host-v1.0.3.sh \
            dist/release.json \
            dist/RELEASE_NOTES.md \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'XNAT v1.0.3' \
            --notes-file /tmp/notes.md

      - name: 验证 latest Release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = 'v1.0.3'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/agent/VERSION?ref=v1.0.3" --jq .content | base64 -d | tr -d '[:space:]')" = '1.0.1'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/agent/API_VERSION?ref=v1.0.3" --jq .content | base64 -d | tr -d '[:space:]')" = '2'
