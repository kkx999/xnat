name: Publish XNAT v1.0.3

on:
  push:
    branches:
      - release/1.0.2
    paths:
      - .github/workflows/publish-v1.0.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 89d61d9e01e43ce88fc1625ac873f11c2b75e133
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.3" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v1.0.3' -f sha="$RELEASE_SHA" >/dev/null
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.3" --jq .object.sha)" = "$RELEASE_SHA"
          cat > /tmp/notes.md <<'EOF'
          # XNAT v1.0.3

          Host Agent 发布元数据热修复。

          - Panel：v1.0.2
          - Host Agent：v1.0.1
          - Agent API：v2
          - Mobile API：v1
          - 修复 v1.0.2 发布包中 Host Agent 版本元数据未同步，导致更新成功后 `xnat` 仍显示 v1.0.0 / Agent API v1 的问题
          - 实际 Agent 业务代码仍为 v1.0.1 / Agent API v2，本次不修改 VPS、Incus、NAT、Panel UI 或现有业务逻辑

          ## 已更新过 v1.0.2 但仍显示旧版本的 Host

          确认 Panel 已升级到 v1.0.2 后，在 Host 执行：

          ```bash
          XNAT_ALLOW_AGENT_API_CHANGE=1 xnat
          ```

          然后重新进入 **更新 → Host Agent 更新**。完成后应显示 Host Agent v1.0.1 / Agent API v2。

          **由 𝐍𝐀𝐌𝐄𝐋𝐄𝐒𝐒 和 GPT 倾力打造**
          EOF
          if ! gh release view v1.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.0.3 --repo "$GITHUB_REPOSITORY" --verify-tag --title 'XNAT v1.0.3' --notes-file /tmp/notes.md
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = 'v1.0.3'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/agent/VERSION?ref=v1.0.3" --jq .content | base64 -d | tr -d '[:space:]')" = '1.0.1'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/agent/API_VERSION?ref=v1.0.3" --jq .content | base64 -d | tr -d '[:space:]')" = '2'
