name: XNAT v1.5.0 maintenance

on:
  push:
    branches: ["release/v1.5.0"]

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[xnat-v150-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.5.0
          fetch-depth: 0

      - name: Apply v1.5.0 changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, count=None):
              text = read(path)
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old[:90]!r}')
              if found == 0:
                  raise SystemExit(f'{path}: replacement anchor not found: {old[:90]!r}')
              write(path, text.replace(old, new))

          def sub(path, pattern, repl, count=1, flags=re.S):
              text = read(path)
              new, n = re.subn(pattern, repl, text, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f'{path}: regex expected {count}, matched {n}: {pattern[:100]}')
              write(path, new)

          # ---- Versions ----
          write('VERSION', '1.5.0\n')
          write('panel/VERSION', '1.5.0\n')
          write('agent/VERSION', '1.2.0\n')
          write('panel/app/__init__.py', '__version__ = "1.5.0"\n')
          write('agent/natvps_agent/__init__.py', '__version__ = "1.2.0"\n__api_version__ = "1"\n')
          meta = json.loads(read('release.json'))
          meta.update(release_version='1.5.0', panel_version='1.5.0', agent_version='1.2.0')
          payload = json.dumps(meta, ensure_ascii=False, indent=2) + '\n'
          write('release.json', payload)
          write('dist/release.json', payload)

          # ---- Model / provider typing: allow 128 MiB (= 0.125 GiB) LXC disks ----
          replace('panel/app/models.py', 'disk_gb: Mapped[int] = mapped_column(Integer)', 'disk_gb: Mapped[float] = mapped_column(Float)', 1)
          replace('panel/app/models.py', 'disk_gb: Mapped[int | None] = mapped_column(Integer, nullable=True)', 'disk_gb: Mapped[float | None] = mapped_column(Float, nullable=True)', 1)

          p = 'panel/app/providers/base.py'
          text = read(p).replace('disk_gb: int | None = None', 'disk_gb: float | None = None').replace('disk_gb: int', 'disk_gb: float')
          write(p, text)

          # ---- Host Agent: Alpine/OpenRC + fractional LXC disks ----
          p = 'agent/natvps_agent/main.py'
          text = read(p).replace('AGENT_VERSION = "1.1.1"', 'AGENT_VERSION = "1.2.0"')
          text = text.replace('disk_gb: int', 'disk_gb: float')
          text = text.replace('disk_gb: float = Field(ge=1, le=65536)', 'disk_gb: float = Field(ge=0.125, le=65536)')
          write(p, text)
          replace(p,
              'def random_password(length=20):\n    chars = string.ascii_letters + string.digits + "!@#_-"\n    return "".join(secrets.choice(chars) for _ in range(length))\n',
              'def random_password(length=20):\n    chars = string.ascii_letters + string.digits + "!@#_-"\n    return "".join(secrets.choice(chars) for _ in range(length))\n\n\ndef disk_size_value(disk_gb: float) -> str:\n    """Return an Incus byte-size value while preserving sub-GiB plans."""\n    mib = int(round(float(disk_gb) * 1024))\n    if mib < 128:\n        raise RuntimeError("LXC 实例系统盘至少需要 128 MiB")\n    return f"{mib}MiB"\n', 1)

          sub(p, r'def prepare_ssh\(name: str, password: str\):.*?\n\ndef set_eth0_value', '''def guest_os_family(name: str) -> str:
    proc = run([
        "incus", "exec", name, "--", "sh", "-lc",
        "if [ -f /etc/os-release ]; then . /etc/os-release; printf '%s' \"${ID:-}\"; fi",
    ], check=False, timeout=20)
    os_id = (proc.stdout or "").strip().lower()
    if os_id == "alpine":
        return "alpine"
    if os_id in {"debian", "ubuntu"}:
        return "apt"
    probe = run([
        "incus", "exec", name, "--", "sh", "-lc",
        "command -v apk >/dev/null 2>&1 && echo alpine || (command -v apt-get >/dev/null 2>&1 && echo apt || true)",
    ], check=False, timeout=20)
    family = (probe.stdout or "").strip().lower()
    return family if family in {"alpine", "apt"} else "unknown"


def restart_ssh_service(name: str):
    family = guest_os_family(name)
    if family == "alpine":
        proc = run(["incus", "exec", name, "--", "sh", "-lc", "rc-service sshd restart || rc-service sshd start"], check=False, timeout=35)
    else:
        proc = run(["incus", "exec", name, "--", "sh", "-lc", "systemctl restart ssh || systemctl restart sshd"], check=False, timeout=35)
    if proc.returncode != 0:
        raise RuntimeError(_command_error(["restart ssh"], proc)[:1200])


