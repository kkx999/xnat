  echo "       XNAT Host 安装 · 环境确认"
  echo "========================================"
  printf '  模式：        %s\\n' "${VIRTUALIZATION_LABEL}"
  printf '  CPU：         %s 核      ✓ 最低 1 核\\n' "${CPU_CORES}"
  printf '  内存：        %s MiB    ✓ 最低 1 GB\\n' "${MEM_TOTAL_MIB}"
  python3 - "${FREE_MIB}" "${MIN_FREE_MIB}" <<'PY_RES'
import sys
free=int(sys.argv[1]); minimum=int(sys.argv[2])
print(f"  可用硬盘：    {free/1024:.2f} GiB ✓ 最低 {minimum/1024:.1f} GiB")
PY_RES
  if [[ "${VIRTUALIZATION_MODE}" == "kvm" || "${VIRTUALIZATION_MODE}" == "hybrid" ]]; then
    echo "  /dev/kvm：    ✓ 可用"
  fi
  echo "  系统安全预留：2.5 GiB"
  echo "  推荐 natpool：${RECOMMENDED_GB} GiB"
  if (( FREE_MIB < WARN_FREE_MIB )); then
    echo
    echo "  [WARN] 当前属于最低容量区间，仅建议少量轻量实例。"
  fi
fi

if [[ -z "${NATPOOL_GB}" ]]; then
  if [[ -t 0 ]]; then
    echo
    echo "========================================"
    echo "       XNAT Host 安装 · 存储分配"
    echo "========================================"
    echo "默认已自动计算 natpool，普通安装直接回车即可。"
    echo "  系统/XNAT 安全预留：约 2.5 GiB"
    echo "  natpool 推荐值：     ${RECOMMENDED_GB} GiB"
    echo "  natpool 最低值：     ${MIN_POOL_GB} GiB"
    echo
    read -r -p "natpool 大小 [${RECOMMENDED_GB}]: " NATPOOL_GB
    NATPOOL_GB="${NATPOOL_GB:-${RECOMMENDED_GB}}"
  else
    NATPOOL_GB="${RECOMMENDED_GB}"
  fi
fi

[[ "${NATPOOL_GB}" =~ ^[0-9]+$ ]] || die "NATPOOL_GB 必须是整数 GiB"
(( NATPOOL_GB >= MIN_POOL_GB )) || die "${VIRTUALIZATION_LABEL} 模式 natpool 至少需要 ${MIN_POOL_GB}GiB"
(( NATPOOL_GB <= MAX_SAFE_GB )) || die "natpool=${NATPOOL_GB}GiB 过大；当前安全上限 ${MAX_SAFE_GB}GiB，需要为系统/XNAT 保留约 2.5GiB"

if command -v incus''', 1)

          replace(p, 'incus launch images:debian/12 "${TEST_NAME}" \\\n  --storage "${POOL_NAME}" \\\n  --config limits.cpu=1 \\\n  --config limits.memory=128MiB \\\n  --device root,size=2GiB', 'incus launch images:alpine/3.24 "${TEST_NAME}" \\\n  --storage "${POOL_NAME}" \\\n  --config limits.cpu=1 \\\n  --config limits.memory=64MiB \\\n  --device root,size=512MiB', 1)
          replace(p, '(( BYTES >= 1500*1024*1024 && BYTES <= 2300*1024*1024 )) ||\n  die "2GiB 磁盘配额验证失败"\n\nincus exec "${TEST_NAME}" -- getent hosts deb.debian.org >/dev/null ||\n  die "测试容器无法联网"', '(( BYTES >= 384*1024*1024 && BYTES <= 640*1024*1024 )) ||\n  die "512MiB LXC 磁盘配额验证失败"\n\nincus exec "${TEST_NAME}" -- sh -lc "apk update >/dev/null" ||\n  die "Alpine LXC 测试容器无法联网"', 1)

          # ---- Upgrade path ----
          replace('scripts/upgrade-panel.sh', 'case "$CURRENT_VERSION" in\n  1.4.2-dev1)', 'case "$CURRENT_VERSION" in\n  1.4.3) UPGRADE_PATH="verified-v1.4.3" ;;\n  1.4.2-dev1)', 1)
          replace('scripts/upgrade-host-agent.sh', 'echo "首次启用 Agent v1.1.x 虚拟化能力：请选择 Host 虚拟化模式。"', 'echo "首次配置 Host 虚拟化能力：请选择运行模式。"', 1)

          # ---- Visible product version ----
          replace('panel/app/templates/base.html', 'XNAT v1.4.3 Multi-Node', 'XNAT v1.5.0 Multi-Node', 1)

          # Add regression guards for the new low-resource/Alpine behavior.
          p = 'scripts/check.sh'
          text = read(p)
          marker = '# v1.3.2 Mobile API v1 contract for XNAT Android v1.0.0.\n'
          guards = '''# v1.5.0 low-resource Host / Alpine compatibility contracts.
grep -q 'MIN_FREE_MIB=4608' scripts/install-host.sh
grep -q 'MIN_FREE_MIB=6656' scripts/install-host.sh
grep -q 'images:alpine/3.24' scripts/install-host.sh
grep -q 'def guest_os_family' agent/natvps_agent/main.py
grep -q 'apk add --no-cache openssh' agent/natvps_agent/main.py
grep -q 'disk_size_value' agent/natvps_agent/main.py
grep -q 'family not in {"apt", "alpine"}' panel/app/main.py
grep -q '0.125' panel/app/templates/admin.html
grep -q 'physical_remaining_disk_gb' panel/app/nodes.py
grep -q '1.4.3) UPGRADE_PATH="verified-v1.4.3"' scripts/upgrade-panel.sh

'''
          if guards not in text:
              if marker not in text: raise SystemExit('check.sh insertion marker missing')
              text = text.replace(marker, guards + marker, 1)
          write(p, text)

          # Self-remove this one-off maintenance workflow from the resulting release tree.
          Path('.github/workflows/xnat-v150-maintenance.yml').unlink()
          PY

      - name: Static self-check
        shell: bash
        run: |
          python3 -m compileall -q panel/app agent/natvps_agent
          bash -n scripts/install-host.sh
          bash -n scripts/upgrade-panel.sh
          bash -n scripts/upgrade-host-agent.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path('VERSION').read_text().strip() == '1.5.0'
          assert Path('panel/VERSION').read_text().strip() == '1.5.0'
          assert Path('agent/VERSION').read_text().strip() == '1.2.0'
          meta=json.loads(Path('release.json').read_text())
          assert meta['release_version']=='1.5.0'
          assert meta['panel_version']=='1.5.0'
          assert meta['agent_version']=='1.2.0'
          PY
          grep -q 'images:alpine/3.24' panel/app/main.py
          grep -q 'apk add --no-cache openssh' agent/natvps_agent/main.py
          grep -q 'MIN_FREE_MIB=4608' scripts/install-host.sh
          grep -q 'MIN_FREE_MIB=6656' scripts/install-host.sh

      - name: Commit staged release changes
        shell: bash
        run: |
          git config user.name "XNAT Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "XNAT v1.5.0 low-resource hosts and Alpine [xnat-v150-applied]"
          git push origin HEAD:release/v1.5.0
