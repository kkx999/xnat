    try:
        run(["incus", "exec", name, "--", "chpasswd"], input_text=f"root:{password}\\n", timeout=30)
    except Exception as exc:
        raise RuntimeError(f"KVM/LXC SSH 初始化失败 [设置 root 密码]: {exc}") from exc

    family = guest_os_family(name)
