name: Publish clean XNAT v1.0.2

on:
  push:
    branches:
      - release/1.0.2
    paths:
      - .github/workflows/publish-v1.0.2-clean.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create clean v1.0.2 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 24324154a5170eaacc759e44b7b2cfe5d825271d
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.2" >/dev/null 2>&1; then
            echo 'v1.0.2 tag already exists' >&2
            exit 1
          fi
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.2 release already exists' >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v1.0.2' -f sha="$RELEASE_SHA" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.2" --jq .object.sha)" = "$RELEASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=v1.0.2" --jq .content | base64 -d | tr -d '[:space:]')" = '1.0.2'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/panel/VERSION?ref=v1.0.2" --jq .content | base64 -d | tr -d '[:space:]')" = '1.0.2'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/agent/VERSION?ref=v1.0.2" --jq .content | base64 -d | tr -d '[:space:]')" = '1.0.1'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/agent/API_VERSION?ref=v1.0.2" --jq .content | base64 -d | tr -d '[:space:]')" = '2'

          cat > /tmp/notes.md <<'EOF'
          # XNAT v1.0.2

          稳定性、安全性与跨层一致性更新。

          - Panel：v1.0.2
          - Host Agent：v1.0.1
          - Agent API：v2
          - Mobile API：v1
          - 完善开通幂等与孤儿实例恢复，降低 Panel 超时后重复开通或错误退款风险
          - Job 抢占改为原子状态切换，NAT / SSH 公网端口加入 Host 级租约与唯一约束
          - Panel ↔ Host 加入 TLS 证书指纹固定与持久化；Agent API v2 加入 nonce 防重放
          - 重装增加破坏性操作前预检、失败恢复保护与旧实例身份元数据补齐
          - Web、Mobile、Worker 与 Agent 增加系统镜像最低磁盘校验
          - 修复最小化 Alpine / Debian / Ubuntu 环境中的 SSH readiness 兼容问题
          - 修正正式发布元数据，确保 Host Agent v1.0.1 / Agent API v2 被 `xnat` 正确识别
          - Panel UI、页面布局、视觉风格和主要业务交互保持不变

          ## 升级说明

          1. 先在 Panel 服务器执行 `xnat`，升级 Panel 到 v1.0.2。
          2. 再逐台 Host 更新 Host Agent 到 v1.0.1。
          3. Host Agent 从 API v1 升级到 API v2 时，确认 Panel 已升级到 v1.0.2 后，在该 Host 执行：

          ```bash
          XNAT_ALLOW_AGENT_API_CHANGE=1 xnat
          ```

          然后进入 **更新 → Host Agent 更新**。该变量只用于本次跨 API 升级，无需写入 `.env` 或永久设置。

          **由 𝐍𝐀𝐌𝐄𝐋𝐄𝐒𝐒 和 GPT 倾力打造**
          EOF

          gh release create v1.0.2 --repo "$GITHUB_REPOSITORY" --verify-tag --title 'XNAT v1.0.2' --notes-file /tmp/notes.md
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = 'v1.0.2'
