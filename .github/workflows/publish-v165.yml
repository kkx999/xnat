name: Publish XNAT v1.6.5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v165.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release metadata
        run: |
          test "$(cat VERSION)" = "1.6.5"
          python3 - <<'PY'
          import json
          m=json.load(open('release.json'))
          assert m['release_version']=='1.6.5'
          assert m['panel_version']=='1.6.3'
          assert m['agent_version']=='1.2.1'
          assert str(m['agent_api_version'])=='1'
          assert str(m['mobile_api_version'])=='1'
          PY
          bash -n scripts/install-host.sh

      - name: Publish formal release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_TARGET: f354b0b6131030a6905cd5d3e8cdabe8e454f4d5
        run: |
          git cat-file -e "${TAG_TARGET}^{commit}"
          if ! gh release view v1.6.5 >/dev/null 2>&1; then
            cat > /tmp/v165-notes.md <<'EOF'
          ## XNAT v1.6.5

          Host 磁盘规划修复版本。

          - 修复全新 Host 在安装 Incus/LVM/Python/Agent Runtime **之前**就计算 natpool，导致把后续 Host 软件占用误算进小鸡磁盘池的问题。
          - 现在先完成 Host 基础依赖、Incus 与 Host Agent Runtime 安装并清理 APT 下载缓存，再读取根分区真实可用空间。
          - LXC：natpool 满载后为 Host 长期保留约 **2GiB**。
          - KVM / 混合：natpool 满载后为 Host 长期保留约 **3GiB**。
          - 创建 LVM Thin 前会再次读取 `/` 可用空间；如果安装期间空间变化导致原选择不再安全，会直接拒绝创建过大的 natpool。
          - v1.6.4 的 512MiB 根分区保护、白名单安全清理、HTTP 507 与 Incus ENOSPC 单次恢复机制全部保留。
          - 本次不修改 Panel 与 Host Agent Runtime：Panel **v1.6.3**、Host Agent **v1.2.1**、Agent API / Mobile API **v1**。
          - 已存在的 natpool **不会自动缩容**；旧 Host 若已经因池过大接近满盘，应扩容系统盘，或迁移/重装 Host 后按 v1.6.5 新算法重新分配。

          现有 Host 可同步 Release / 管理脚本：

          ```bash
          xnat update 1.6.5
          ```

          新算法主要影响 **全新 Host 安装**。
          EOF
            gh release create v1.6.5 \
              --target "${TAG_TARGET}" \
              --title "XNAT v1.6.5" \
              --notes-file /tmp/v165-notes.md
          fi

          git fetch --tags --force
          test "$(git rev-list -n 1 v1.6.5)" = "${TAG_TARGET}"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v1.6.5 --jq .target_commitish)" = "${TAG_TARGET}"

      - name: Remove one-shot publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v165.yml
          git commit -m "ci: remove v1.6.5 publisher"
          git push origin HEAD:main
