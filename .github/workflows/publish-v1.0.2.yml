name: Publish XNAT v1.0.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git fetch --tags --force
          if ! git rev-parse -q --verify refs/tags/v1.0.2 >/dev/null; then
            git tag -a v1.0.2 cd7e2a7e38fb7cdc122a07d8e5a527164046468d -m 'XNAT v1.0.2'
            git push origin refs/tags/v1.0.2
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 >/dev/null 2>&1; then
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          XNAT 1.0.2

          Versions:
          - Panel 1.0.2
          - Host Agent 1.0.1
          - Agent API 2
          - Mobile API 1

          Highlights:
          - Idempotent provisioning and orphan recovery.
          - No automatic refund while remote provisioning outcome is uncertain; refund occurs only after Host confirms absence.
          - Atomic job claiming and concurrent Host NAT-port reservation.
          - Persistent TOFU TLS certificate fingerprint pinning and HMAC nonce replay defense.
          - Rollback-safe reinstall with legacy server_id metadata backfill.
          - Shared image policy with Web/Mobile/worker/Agent disk validation.
          - Alpine minimal-image SSH/iproute2 hardening.
          - Release/version cleanup and stale User-Agent removal.
          - Existing UI, templates, static assets, layout and interaction flow remain unchanged.
          EOF
          gh release create v1.0.2 --verify-tag --title 'XNAT v1.0.2' --notes-file /tmp/release-notes.md
