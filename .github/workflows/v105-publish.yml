name: Publish XNAT v1.0.5
on:
  push:
    branches: [release/v1.0.5]
    paths:
      - '.github/workflows/v105-publish.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -q -r panel/requirements.txt -r agent/requirements.txt
      - name: Final source checks
        run: bash scripts/check-v105.sh
      - name: Build release assets
        run: bash scripts/build-release.sh
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(cat VERSION)" = "1.0.5"
          test "$(cat panel/VERSION)" = "1.0.5"
          test "$(cat agent/VERSION)" = "1.0.4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse 'refs/tags/v1.0.5' >/dev/null 2>&1; then
            echo 'v1.0.5 tag already exists; refusing to retag'
            exit 1
          fi
          git tag -a v1.0.5 -m 'XNAT v1.0.5'
          git push origin v1.0.5
          gh release create v1.0.5 dist/* --title 'XNAT v1.0.5' --notes-file dist/RELEASE_NOTES.md --verify-tag --latest
