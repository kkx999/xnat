name: Polish XNAT v1.6.5

on:
  push:
    branches:
      - release/v1.6.5

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6.5
          fetch-depth: 0
      - name: Apply polish
        run: python3 tools/polish-v165.py
      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check -q -r panel/requirements.txt -r agent/requirements.txt
      - name: Full regression check
        run: bash scripts/check.sh
      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/polish-v165.yml tools/polish-v165.py
          git add scripts/install-host.sh scripts/check.sh README.md CHANGELOG.md
          git commit -m "fix(host): size natpool after Agent runtime install"
          git push origin HEAD:release/v1.6.5
