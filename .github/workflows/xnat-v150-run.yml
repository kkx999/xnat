name: XNAT v1.5.0 apply
on:
  push:
    branches:
      - release/v1.5.0
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[xnat-v150-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.5.0
          fetch-depth: 0
      - name: Apply direct patch
        shell: bash
        run: |
          python3 -m py_compile scripts/release-v150-patch.py
          python3 scripts/release-v150-patch.py
      - name: Syntax and contract checks
        shell: bash
        run: |
          python3 -m compileall -q panel/app agent/natvps_agent
          bash -n scripts/install-host.sh
          bash -n scripts/upgrade-panel.sh
          bash -n scripts/upgrade-host-agent.sh
          grep -q 'MIN_FREE_MIB=4608' scripts/install-host.sh
          grep -q 'MIN_FREE_MIB=6656' scripts/install-host.sh
          grep -q 'images:alpine/3.24' panel/app/main.py
          grep -q 'apk add --no-cache openssh' agent/natvps_agent/main.py
          grep -q '0.125' panel/app/templates/admin.html
          grep -q 'physical_remaining_disk_gb' panel/app/nodes.py
          ! grep -RIn 'system_image.family != "apt"' panel/app
          ! grep -RIn 'SystemImage.family == "apt"' panel/app
          ! grep -RIn 'disk_gb: int' panel/app/providers agent/natvps_agent
      - name: Commit checked result
        shell: bash
        run: |
          rm -rf .github/workflows
          rmdir .github 2>/dev/null || true
          rm -f scripts/release-v150-patch.py
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'XNAT v1.5.0 low-resource hosts and Alpine [xnat-v150-applied]'
          git push origin HEAD:release/v1.5.0
