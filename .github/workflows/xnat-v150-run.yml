name: XNAT v1.5.0 apply
on:
  push:
    branches:
      - release/v1.5.0
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[xnat-v150-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.5.0
          fetch-depth: 0
      - name: Apply direct patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/release-v150-patch.py')
          text=p.read_text()
          text=text.replace(
              're.subn(pattern, replacement, text, count=1, flags=re.S)',
              're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)',
              1,
          )
          start=text.index("replace_once(\n    p,\n    '''incus launch images:debian/12")
          end=text.index("\n\n# ---------------------------------------------------------------------------\n# Upgrade compatibility", start)
          p.write_text(text[:start] + text[end:])
          PY
          python3 -m py_compile scripts/release-v150-patch.py
          python3 scripts/release-v150-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/install-host.sh')
          text=p.read_text()
          text=text.replace('incus launch images:debian/12 "${TEST_NAME}"', 'incus launch images:alpine/3.24 "${TEST_NAME}"', 1)
          text=text.replace('--config limits.memory=128MiB', '--config limits.memory=64MiB', 1)
          text=text.replace('--device root,size=2GiB', '--device root,size=512MiB', 1)
          text=text.replace('(( BYTES >= 1500*1024*1024 && BYTES <= 2300*1024*1024 )) ||', '(( BYTES >= 384*1024*1024 && BYTES <= 640*1024*1024 )) ||', 1)
          text=text.replace('die "2GiB 磁盘配额验证失败"', 'die "512MiB LXC 磁盘配额验证失败"', 1)
          text=text.replace('incus exec "${TEST_NAME}" -- getent hosts deb.debian.org >/dev/null ||\n  die "测试容器无法联网"', 'incus exec "${TEST_NAME}" -- sh -lc "apk update >/dev/null" ||\n  die "Alpine LXC 测试容器无法联网"', 1)
          p.write_text(text)
          for name in ('panel/app/providers/remote.py', 'panel/app/providers/mock.py'):
              q=Path(name)
              q.write_text(q.read_text().replace('disk_gb: int', 'disk_gb: float'))
          PY
      - name: Syntax and contract checks
        shell: bash
        run: |
          python3 -m compileall -q panel/app agent/natvps_agent
          bash -n scripts/install-host.sh
          bash -n scripts/upgrade-panel.sh
          bash -n scripts/upgrade-host-agent.sh
          grep -q 'MIN_FREE_MIB=4608' scripts/install-host.sh
          grep -q 'MIN_FREE_MIB=6656' scripts/install-host.sh
          grep -q 'images:alpine/3.24' scripts/install-host.sh
          grep -q 'images:alpine/3.24' panel/app/main.py
          grep -q 'apk add --no-cache openssh' agent/natvps_agent/main.py
          grep -q '0.125' panel/app/templates/admin.html
          grep -q 'physical_remaining_disk_gb' panel/app/nodes.py
          ! grep -RIn 'system_image.family != "apt"' panel/app
          ! grep -RIn 'SystemImage.family == "apt"' panel/app
          ! grep -RIn 'disk_gb: int' panel/app/providers agent/natvps_agent
      - name: Commit checked result
        shell: bash
        run: |
          rm -rf .github/workflows
          rmdir .github 2>/dev/null || true
          rm -f scripts/release-v150-patch.py
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'XNAT v1.5.0 low-resource hosts and Alpine [xnat-v150-applied]'
          git push origin HEAD:release/v1.5.0
