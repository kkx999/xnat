name: Publish XNAT v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release-v110.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'kkx999/xnat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release version
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.1.0"
          test "$(tr -d '[:space:]' < panel/VERSION)" = "1.1.0"
          test "$(tr -d '[:space:]' < agent/VERSION)" = "1.0.5"
          test "$(tr -d '[:space:]' < agent/API_VERSION)" = "2"

      - name: Install verification dependencies
        run: python -m pip install -q -r panel/requirements.txt -r agent/requirements.txt

      - name: Build and verify release
        run: bash scripts/build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 already exists"
            exit 1
          fi
          gh release create v1.1.0 dist/* \
            --target "$GITHUB_SHA" \
            --title "XNAT v1.1.0" \
            --notes-file dist/RELEASE_NOTES.md
