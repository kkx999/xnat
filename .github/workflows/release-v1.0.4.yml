name: Publish XNAT v1.0.4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.0.4.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -q -r panel/requirements.txt -r agent/requirements.txt
      - name: Verify release metadata
        run: |
          test "$(cat VERSION)" = "1.0.4"
          test "$(cat panel/VERSION)" = "1.0.4"
          test "$(cat agent/VERSION)" = "1.0.4"
          python - <<'PY'
          import json
          m=json.load(open('release.json'))
          assert m['release_version']==m['panel_version']==m['agent_version']=='1.0.4'
          assert str(m['agent_api_version'])=='2'
          assert str(m['mobile_api_version'])=='1'
          PY
      - name: Full check
        run: bash scripts/check.sh
      - name: Build release assets
        run: bash scripts/build-release.sh
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse 'refs/tags/v1.0.4' >/dev/null 2>&1; then
            echo 'v1.0.4 tag already exists; refusing to retag'
            exit 1
          fi
          git tag -a v1.0.4 -m 'XNAT v1.0.4'
          git push origin v1.0.4
          gh release create v1.0.4 dist/* --title 'XNAT v1.0.4' --notes-file dist/RELEASE_NOTES.md --verify-tag
