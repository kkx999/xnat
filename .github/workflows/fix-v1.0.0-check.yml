name: Align v1.0.0 regression baseline

on:
  push:
    branches:
      - release/v1.0.0-reset

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-reset
      - name: Align baseline assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check.sh')
          s=p.read_text()
          old="assert '当前正式版本：XNAT v1.6.5' in readme"
          new="assert '当前正式版本：v1.0.0' in readme"
          if old not in s:
              raise SystemExit('expected old README baseline assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/fix-v1.0.0-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check.sh .github/workflows/fix-v1.0.0-check.yml
          git commit -m "test: align v1.0.0 README baseline"
          git push origin HEAD:release/v1.0.0-reset
