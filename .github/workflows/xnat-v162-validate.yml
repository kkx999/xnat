name: XNAT v1.6.2 validate
on:
  push:
    branches: [release/v1.6.2]
permissions:
  contents: write
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6.2
          fetch-depth: 0
      - name: Apply v1.6.2 patch
        shell: bash
        run: |
          python3 -m py_compile scripts/release-v162-patch.py
          python3 scripts/release-v162-patch.py
      - name: Install dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check -r panel/requirements.txt -r agent/requirements.txt
      - name: Repository regression checks
        shell: bash
        run: |
          bash scripts/check.sh
          bash -n scripts/*.sh scripts/xnat scripts/xnat-firewall
      - name: Capacity semantics smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session
          from panel.app.db import Base
          from panel.app.models import HostNode, Plan
          from panel.app.nodes import host_plan_capacity_estimates, host_schedule_state

          engine = create_engine('sqlite:///:memory:')
          Base.metadata.create_all(engine)
          with Session(engine) as db:
              host = HostNode(
                  name='HK', region='hk', api_url='https://127.0.0.1:29443', api_token_enc='x', public_ip='203.0.113.10',
                  port_start=30000, port_end=39999, max_vps=0, enabled=True, verify_tls=False,
                  virtualization_modes='lxc', kvm_available=False, maintenance_mode=False,
                  schedule_cpu_max_percent=100, schedule_memory_max_percent=100, schedule_storage_max_percent=100,
                  status='online', cpu_percent=0.0, memory_total_mb=967, memory_used_mb=384,
                  storage_total_gb=2.0, storage_used_gb=0.2, active_vps=0, last_seen_at=datetime.utcnow(),
              )
              plan = Plan(
                  name='NAT Mini', cpu=1, memory_mb=128, disk_gb=1.0, port_count=5,
                  bandwidth_mbps=100, traffic_gb=500, monthly_price_cents=100,
                  traffic_reset_price_cents=100, stock_limit=0, virtualization_type='lxc',
                  sort_order=1, homepage_visible=True, homepage_sort_order=1,
                  is_recommended=False, recommendation_label='推荐', is_active=True,
              )
              db.add_all([host, plan])
              db.commit()

              state = host_schedule_state(db, host, plan)
              cap = state['capacity']
              assert state['allowed'] is True, state
              assert cap['logical_remaining_disk_gb'] == 2.0, cap
              assert cap['physical_remaining_disk_gb'] == 1.8, cap
              assert cap['remaining_disk_gb'] == 1.8, cap

              rows = host_plan_capacity_estimates(db, host, [plan])
              assert len(rows) == 1, rows
              assert rows[0]['count'] == 2, rows
              assert rows[0]['limiter'] == '存储', rows
              print('2GB pool / 0.2GB physical / 0GB logical =>', rows[0])

              # Physical usage still blocks scheduling at the configured watermark.
              host.storage_used_gb = 2.0
              db.commit()
              rows = host_plan_capacity_estimates(db, host, [plan])
              assert rows[0]['count'] == 0, rows
              assert '调度阈值' in rows[0]['reason'], rows
              print('physical watermark protection =>', rows[0])
          PY
      - name: README landing-page checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md').read_text()
          required = [
              '当前正式版本：XNAT v1.6.2',
              'Host Agent | v1.2.0',
              'Debian 13 Trixie',
              'Ubuntu 26.04 LTS Resolute',
              '按套餐预计可开',
              'xnat update 1.6.2',
              'CHANGELOG.md',
              'docs/README.md',
          ]
          for text in required:
              assert text in p, text
          for legacy in ['指定 v1.4.3 安装', '从 v1.4.2 升级到 v1.4.3', '从 v1.3.0 升级到 v1.3.1']:
              assert legacy not in p, legacy
          print('README v1.6.2 landing page: ok')
          PY
      - name: Build release assets
        shell: bash
        run: |
          bash scripts/build-release.sh
          test -s dist/xnat-panel-v1.6.2.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.6.2.sh
          test -s dist/xnat-bootstrap-host-v1.6.2.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Commit validated tree
        shell: bash
        run: |
          find panel agent scripts -type d -name '__pycache__' -prune -exec rm -rf {} +
          find panel agent scripts -type f -name '*.pyc' -delete
          rm -f scripts/release-v162-patch.py .github/workflows/xnat-v162-validate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'XNAT v1.6.2: correct quota capacity and refresh README [v162-built]'
          git push origin HEAD:release/v1.6.2
