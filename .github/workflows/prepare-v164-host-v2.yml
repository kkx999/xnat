name: Prepare XNAT v1.6.4 Host fixes v2
on:
  push:
    branches:
      - release/v1.6.4-host-v1.2.1
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6.4-host-v1.2.1
          fetch-depth: 0
      - name: Apply scoped Host fixes
        run: python3 .github/prepare_v164.py
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -q -r panel/requirements.txt -r agent/requirements.txt
      - name: Validate source and regression contracts
        run: |
          git diff --check
          bash -n scripts/xnat scripts/install-host.sh scripts/upgrade-host-agent.sh scripts/build-release.sh
          python3 -m compileall -q agent/natvps_agent panel/app
          bash scripts/check.sh
      - name: Build and verify release assets
        run: |
          bash scripts/build-release.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test "$(cat VERSION)" = "1.6.4"
          test "$(cat panel/VERSION)" = "1.6.3"
          test "$(cat agent/VERSION)" = "1.2.1"
          test -s dist/xnat-host-agent-v1.2.1.zip
          test -s dist/xnat-bootstrap-host-v1.6.4.sh
          test -s dist/RELEASE_NOTES.md
      - name: Commit validated changes and self-clean
        run: |
          rm -f .github/workflows/prepare-v164-host.yml
          rm -f .github/workflows/prepare-v164-host-v2.yml
          rm -f .github/prepare_v164.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: XNAT v1.6.4 host disk safety and maintenance'
          git push origin HEAD:release/v1.6.4-host-v1.2.1
