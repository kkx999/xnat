name: Build XNAT 1.0.2

on:
  push:
    branches:
      - release/1.0.2

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/1.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply final hardening
        run: python scripts/finalize-release-1.0.2.py

      - name: Assert UI unchanged
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- panel/app/templates panel/app/static)"
          test -z "$changed"

      - name: Release self-check
        run: python scripts/check-release-1.0.2.py

      - name: Compile final source
        run: |
          python -m compileall -q panel/app agent/natvps_agent
          git diff --check

      - name: Commit finalized source
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add panel/app agent/natvps_agent
          if ! git diff --cached --quiet; then
            git commit -m 'release: finalize XNAT 1.0.2 source'
            git push origin HEAD:release/1.0.2
          fi
