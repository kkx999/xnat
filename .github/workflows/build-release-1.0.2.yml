name: Build XNAT 1.0.2

on:
  push:
    branches:
      - release/1.0.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Panel 1.0.2 patch
        run: python scripts/apply-release-1.0.2-panel.py

      - name: Apply Host Agent 1.0.1 patch
        run: python scripts/apply-release-1.0.2-agent.py

      - name: Assert UI and interaction assets unchanged
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- panel/app/templates panel/app/static)"
          if [ -n "$changed" ]; then
            echo "UI/static files were modified unexpectedly:"
            echo "$changed"
            exit 1
          fi

      - name: Release self-check
        run: python scripts/check-release-1.0.2.py

      - name: Diff sanity check
        run: git diff --check

      - name: Commit generated release code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'release: generate XNAT 1.0.2'
            git push origin HEAD:release/1.0.2
          fi
