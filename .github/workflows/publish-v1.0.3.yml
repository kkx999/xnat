name: Publish XNAT v1.0.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare v1.0.3
        run: python3 scripts/prepare-v1.0.3.py

      - name: Validate and build release assets
        run: |
          python3 -m pip install --disable-pip-version-check -r panel/requirements.txt
          bash scripts/check.sh
          bash scripts/build-release.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('release.json').read_text())
          assert Path('VERSION').read_text().strip() == '1.0.3'
          assert Path('panel/VERSION').read_text().strip() == '1.0.3'
          assert meta == {
              'release_version': '1.0.3',
              'panel_version': '1.0.3',
              'agent_version': '1.0.1',
              'agent_api_version': '2',
              'supported_agent_api_versions': ['1', '2'],
              'mobile_api_version': '1',
          }
          print('v1.0.3 release matrix verified')
          PY

      - name: Commit release state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/prepare-v1.0.3.py
          git add VERSION panel/VERSION panel/app/__init__.py release.json panel/app/main.py panel/app/templates/base.html scripts/upgrade-panel.sh scripts/check.sh README.md docs/MOBILE_API.md docs/INTRODUCTION.md CHANGELOG.md scripts/build-release.sh
          git commit -m 'release: XNAT v1.0.3'
          git push origin HEAD:main

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FINAL_SHA="$(git rev-parse HEAD)"
          gh release create v1.0.3 dist/* --target "$FINAL_SHA" --title 'XNAT v1.0.3' --notes-file dist/RELEASE_NOTES.md
          gh release view v1.0.3 --json tagName,name,isDraft,isPrerelease,targetCommitish,url
