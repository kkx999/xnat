name: XNAT v1.5.0 validate and build
on:
  push:
    branches: [release/v1.5.0]
permissions:
  contents: write
jobs:
  validate-build:
    if: ${{ !contains(github.event.head_commit.message, '[v150-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.5.0
          fetch-depth: 0
      - name: Prepare clean release tree
        shell: bash
        run: |
          find panel agent scripts -type d -name '__pycache__' -prune -exec rm -rf {} +
          printf '%s\n' '__pycache__/' '*.py[cod]' > .gitignore
          python3 -c 'from pathlib import Path; p=Path("CHANGELOG.md"); t=p.read_text(); e="## v1.5.0\n\n- LXC Host 最低安装门槛调整为 1C / 1GB / 4.5GB 可用硬盘；KVM / 混合 Host 调整为 1C / 1GB / 6.5GB，并继续强制检查 `/dev/kvm`。\n- Host 安装菜单新增模式最低门槛、当前资源检测、低容量提示、系统安全预留和 natpool 自动建议。\n- 新增 Alpine 3.24 LXC；Host Agent v1.2.0 支持 apk + OpenRC SSH 初始化，Debian / Ubuntu 原流程保持兼容。\n- LXC 套餐资源下限放宽到 1C / 64MB / 128MB，管理员可自由向上配置；KVM 小鸡继续保留 512MB / 4GB 技术下限。\n- 宿主机后台可分配资源同时参考逻辑分配量和实际资源水位，并区分逻辑分配与 natpool 实际余量。\n- Panel 升级至 v1.5.0，Host Agent 升级至 v1.2.0；Agent API 与 Mobile API 继续保持 v1。\n- 正式支持 v1.4.3 → v1.5.0 原地升级，已有业务数据与自定义镜像保持兼容。\n\n"; p.write_text(t if "## v1.5.0" in t else t.replace("# Changelog\n\n", "# Changelog\n\n"+e, 1))'
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean release tree and document v1.5.0'
      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check -r panel/requirements.txt -r agent/requirements.txt
      - name: Full project checks
        shell: bash
        run: |
          bash scripts/check.sh
          bash -n scripts/*.sh
          if grep -RInE 'disk_gb: int|int\([^)]*disk_gb' panel/app agent/natvps_agent; then
            echo 'Found stale integer disk handling that would truncate sub-GiB LXC disks.' >&2
            exit 1
          fi
          python3 -c 'import json; from pathlib import Path; m=json.loads(Path("release.json").read_text()); assert Path("VERSION").read_text().strip()=="1.5.0"; assert Path("panel/VERSION").read_text().strip()=="1.5.0"; assert Path("agent/VERSION").read_text().strip()=="1.2.0"; assert m["panel_version"]=="1.5.0" and m["agent_version"]=="1.2.0" and str(m["agent_api_version"])=="1"'
          PYTHONPATH=agent AGENT_TOKEN=validation-token python3 -c 'from natvps_agent.main import disk_size_value; assert disk_size_value(0.125)=="128MiB"; assert disk_size_value(1)=="1024MiB"; print("fractional disk smoke: ok")'
      - name: Build release assets
        shell: bash
        run: |
          bash scripts/build-release.sh
          test -s dist/xnat-panel-v1.5.0.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.5.0.sh
          test -s dist/xnat-bootstrap-host-v1.5.0.sh
          grep -q 'XNAT v1.5.0' dist/RELEASE_NOTES.md
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Commit validated release assets
        shell: bash
        run: |
          find panel agent scripts -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -f .github/workflows/xnat-v150-validate-build.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'release: prepare XNAT v1.5.0 assets [v150-built]'
          git push origin HEAD:release/v1.5.0
