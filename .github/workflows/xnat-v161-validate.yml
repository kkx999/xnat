name: XNAT v1.6.1 validate
on:
  push:
    branches: [release/v1.6.1]
permissions:
  contents: write
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6.1
          fetch-depth: 0
      - name: Apply v1.6.1 patch
        shell: bash
        run: |
          python3 -m py_compile scripts/release-v161-patch.py
          python3 scripts/release-v161-patch.py
      - name: Install dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check -r panel/requirements.txt -r agent/requirements.txt
      - name: Repository regression checks
        shell: bash
        run: |
          bash scripts/check.sh
          bash -n scripts/*.sh scripts/xnat scripts/xnat-firewall
      - name: Capacity estimator smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session
          from panel.app.db import Base
          from panel.app.models import HostNode, Plan
          from panel.app.nodes import host_plan_capacity_estimates

          engine=create_engine('sqlite:///:memory:')
          Base.metadata.create_all(engine)
          with Session(engine) as db:
              host=HostNode(
                  name='HK', region='hk', api_url='https://127.0.0.1:29443', api_token_enc='x', public_ip='45.192.193.76',
                  port_start=30000, port_end=39999, max_vps=0, enabled=True, verify_tls=False,
                  virtualization_modes='lxc', kvm_available=False, maintenance_mode=False,
                  schedule_cpu_max_percent=100, schedule_memory_max_percent=100, schedule_storage_max_percent=100,
                  status='online', cpu_percent=0.0, memory_total_mb=967, memory_used_mb=384,
                  storage_total_gb=2.0, storage_used_gb=0.2, active_vps=0, last_seen_at=datetime.utcnow(),
              )
              plan=Plan(name='轻量 128M', cpu=1, memory_mb=128, disk_gb=1.0, port_count=5, bandwidth_mbps=100, traffic_gb=500,
                        monthly_price_cents=100, traffic_reset_price_cents=100, stock_limit=0,
                        virtualization_type='lxc', sort_order=1, homepage_visible=True, homepage_sort_order=1,
                        is_recommended=False, recommendation_label='推荐', is_active=True)
              db.add_all([host, plan]); db.commit()
              rows=host_plan_capacity_estimates(db, host, [plan])
              assert len(rows)==1, rows
              assert rows[0]['count']==1, rows
              assert rows[0]['limiter']=='存储', rows
              assert rows[0]['spec']=='1C / 128MB / 1GB', rows
              print('capacity smoke:', rows[0])
          PY
      - name: Build release assets
        shell: bash
        run: |
          bash scripts/build-release.sh
          test -s dist/xnat-panel-v1.6.1.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.6.1.sh
          test -s dist/xnat-bootstrap-host-v1.6.1.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Commit validated tree
        shell: bash
        run: |
          find panel agent scripts -type d -name '__pycache__' -prune -exec rm -rf {} +
          find panel agent scripts -type f -name '*.pyc' -delete
          rm -f scripts/release-v161-patch.py .github/workflows/xnat-v161-validate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'XNAT v1.6.1 visible per-plan Host capacity [v161-built]'
          git push origin HEAD:release/v1.6.1
