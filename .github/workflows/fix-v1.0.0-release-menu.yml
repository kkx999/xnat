name: Hide internal release from update menu

on:
  push:
    branches:
      - release/v1.0.0-reset

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-reset
      - name: Remove public release label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/xnat')
          s=p.read_text(encoding='utf-8')
          pat=r'^\s*\[\[ "\$role" == panel && "\$\(current_release\)" != unknown \]\] && printf \'当前 XNAT Release：v%s\n\' "\$\(current_release\)"\n'
          out,n=re.subn(pat,'',s,count=1,flags=re.M)
          if n != 1:
              raise SystemExit(f'update menu release label matches: {n}')
          p.write_text(out, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-v1.0.0-release-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/xnat .github/workflows/fix-v1.0.0-release-menu.yml
          git commit -m "fix: hide internal release from update menu"
          git push origin HEAD:release/v1.0.0-reset
