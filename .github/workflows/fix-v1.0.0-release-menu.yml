name: Hide internal release from update menu

on:
  push:
    branches:
      - release/v1.0.0-reset

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-reset
      - name: Remove public release label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/xnat')
          s=p.read_text(encoding='utf-8')
          old='    [[ "$role" == panel && "$(current_release)" != unknown ]] && printf \'当前 XNAT Release：v%s\\n\' "$(current_release)"\n'
          if old not in s:
              raise SystemExit('update menu release label not found')
          p.write_text(s.replace(old,'',1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-v1.0.0-release-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/xnat .github/workflows/fix-v1.0.0-release-menu.yml
          git commit -m "fix: hide internal release from update menu"
          git push origin HEAD:release/v1.0.0-reset
