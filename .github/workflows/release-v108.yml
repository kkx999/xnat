name: Publish XNAT v1.0.8
on:
  push:
    branches: [main]
    paths:
      - VERSION
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'kkx999/xnat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify release version
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.8"
          test "$(tr -d '[:space:]' < panel/VERSION)" = "1.0.8"
          test "$(tr -d '[:space:]' < agent/VERSION)" = "1.0.4"
      - name: Install verification dependencies
        run: python -m pip install -q -r panel/requirements.txt -r agent/requirements.txt
      - name: Build and verify release
        run: bash scripts/build-release.sh
      - name: Publish GitHub Release
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          gh release view v1.0.8 >/dev/null 2>&1 && { echo "v1.0.8 already exists"; exit 1; } || true
          gh release create v1.0.8 dist/* --target "$GITHUB_SHA" --title "XNAT v1.0.8" --notes-file dist/RELEASE_NOTES.md
