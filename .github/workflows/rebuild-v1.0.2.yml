name: Normalize XNAT v1.0.2

on:
  push:
    branches:
      - release/1.0.2
    paths:
      - .github/workflows/rebuild-v1.0.2.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize versions and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('VERSION').write_text('1.0.2\n', encoding='utf-8')
          Path('panel/VERSION').write_text('1.0.2\n', encoding='utf-8')
          Path('agent/VERSION').write_text('1.0.1\n', encoding='utf-8')
          Path('agent/API_VERSION').write_text('2\n', encoding='utf-8')
          Path('agent/natvps_agent/__init__.py').write_text('__version__ = "1.0.1"\n__api_version__ = "2"\n', encoding='utf-8')
          meta=json.loads(Path('release.json').read_text(encoding='utf-8'))
          meta.update({'release_version':'1.0.2','panel_version':'1.0.2','agent_version':'1.0.1','agent_api_version':'2','supported_agent_api_versions':['1','2'],'mobile_api_version':'1'})
          Path('release.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('**当前正式版本：v1.0.3**','**当前正式版本：v1.0.2**')
          s=s.replace('> v1.0.3 是版本元数据热修复：Panel 仍为 v1.0.2、Host Agent 仍为 v1.0.1、Agent API 仍为 v2、Mobile API 仍为 v1。本次只修正 v1.0.2 发布包中的 Host Agent 版本标识和 `xnat` 更新识别，不修改 VPS、Incus、NAT、Panel UI 或业务逻辑。\n\n','')
          a=s.find('## v1.0.3 热修复'); b=s.find('## v1.0.2 更新')
          if a!=-1 and b!=-1 and a<b: s=s[:a]+s[b:]
          anchor='3. 在 Panel 中确认 Host 在线，并确认 Agent API 已切换到 v2。\n'
          note='\n> Host Agent 从 API v1 升级到 API v2 时，确认 Panel 已升级到 v1.0.2 后，在 Host 执行 `XNAT_ALLOW_AGENT_API_CHANGE=1 xnat`，再进入 **更新 → Host Agent 更新**。该变量只用于本次跨 API 升级，不需要写入 `.env` 或永久设置。\n'
          if 'XNAT_ALLOW_AGENT_API_CHANGE=1 xnat' not in s and anchor in s: s=s.replace(anchor,anchor+note,1)
          p.write_text(s,encoding='utf-8')
          p=Path('CHANGELOG.md'); c=p.read_text(encoding='utf-8')
          if c.startswith('## v1.0.3'):
              i=c.find('## v1.0.2')
              if i!=-1: c=c[i:]
          marker='- 清理旧开发阶段升级脚本并统一版本标识。\n'
          addition='- 修正正式发布元数据，确保 Panel v1.0.2、Host Agent v1.0.1、Agent API v2 与 `xnat` 显示保持一致。\n'
          if addition not in c and marker in c: c=c.replace(marker,marker+addition,1)
          p.write_text(c,encoding='utf-8')
          p=Path('scripts/build-release.sh'); z=p.read_text(encoding='utf-8')
          if 'AGENT_API_VERSION=' not in z: z=z.replace('AGENT_VERSION="$(tr -d \'[:space:]\' < agent/VERSION)"\n','AGENT_VERSION="$(tr -d \'[:space:]\' < agent/VERSION)"\nAGENT_API_VERSION="$(tr -d \'[:space:]\' < agent/API_VERSION)"\n',1)
          z=z.replace('- Host：v${AGENT_VERSION}\n- Agent API：v1','- Host Agent：v${AGENT_VERSION}\n- Agent API：v${AGENT_API_VERSION}')
          p.write_text(z,encoding='utf-8')
          PY

      - name: Validate versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          vals={
            'release':Path('VERSION').read_text().strip(),
            'panel_file':Path('panel/VERSION').read_text().strip(),
            'agent_file':Path('agent/VERSION').read_text().strip(),
            'api_file':Path('agent/API_VERSION').read_text().strip(),
            'panel_init':Path('panel/app/__init__.py').read_text().strip(),
            'agent_init':Path('agent/natvps_agent/__init__.py').read_text().strip(),
          }
          print(vals)
          assert vals['release']=='1.0.2'
          assert vals['panel_file']=='1.0.2'
          assert vals['agent_file']=='1.0.1'
          assert vals['api_file']=='2'
          assert '__version__ = "1.0.2"' in vals['panel_init']
          assert '__version__ = "1.0.1"' in vals['agent_init']
          assert '__api_version__ = "2"' in vals['agent_init']
          meta=json.loads(Path('release.json').read_text())
          assert meta['release_version']=='1.0.2' and meta['panel_version']=='1.0.2' and meta['agent_version']=='1.0.1' and str(meta['agent_api_version'])=='2'
          for name in ('README.md','CHANGELOG.md'):
              assert 'v1.0.3' not in Path(name).read_text(encoding='utf-8'), name
          print('version and documentation assertions: OK')
          PY
          grep -F 'AGENT_VERSION = "1.0.1"' agent/natvps_agent/main.py
          grep -F 'AGENT_API_VERSION = "2"' agent/natvps_agent/main.py
          python3 -m compileall -q panel/app agent/natvps_agent
          python3 -m pip install --disable-pip-version-check jinja2
          bash -x scripts/check.sh

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@github.com
          git add VERSION release.json panel/VERSION agent/VERSION agent/API_VERSION agent/natvps_agent/__init__.py README.md CHANGELOG.md scripts/build-release.sh
          if ! git diff --cached --quiet; then
            git commit -m 'release: normalize XNAT v1.0.2 metadata'
            git push origin HEAD:main
          fi
