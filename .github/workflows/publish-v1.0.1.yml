name: Publish XNAT v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TARGET_SHA: 226291447acd662165be737f928c073ac4bd6bb5
      TAG: v1.0.1
    steps:
      - name: Checkout exact release tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify release tree
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = "1.0.1"
          test "$(cat panel/VERSION)" = "1.0.1"
          test "$(cat agent/VERSION)" = "1.0.0"
          grep -q '"release_version": "1.0.1"' release.json
          grep -q '"panel_version": "1.0.1"' release.json
          grep -q '"agent_version": "1.0.0"' release.json
          test -f dist/xnat-panel-v1.0.1.zip
          test -f dist/xnat-host-agent-v1.0.0.zip
          test -f dist/xnat-bootstrap-panel-v1.0.1.sh
          test -f dist/xnat-bootstrap-host-v1.0.1.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "XNAT v1.0.1" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/release.json \
            dist/SHA256SUMS.txt \
            dist/xnat-bootstrap-panel-v1.0.1.sh \
            dist/xnat-bootstrap-host-v1.0.1.sh \
            dist/xnat-panel-v1.0.1.zip \
            dist/xnat-host-agent-v1.0.0.zip

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,name \
            --jq 'select(.tagName == "v1.0.1" and .isDraft == false and .isPrerelease == false and .name == "XNAT v1.0.1")' >/dev/null
