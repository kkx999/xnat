name: Publish XNAT v1.6.2
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v162.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release tree
        shell: bash
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "1.6.2"
          test "$(tr -d '[:space:]' < panel/VERSION)" = "1.6.2"
          test "$(tr -d '[:space:]' < agent/VERSION)" = "1.2.0"
          git cat-file -e ec621031854e22cdcd93776b0c4c387e92ce77cf^{commit}
          python3 - <<'PY'
          import json
          m=json.load(open('release.json'))
          assert m['release_version']=='1.6.2'
          assert m['panel_version']=='1.6.2'
          assert m['agent_version']=='1.2.0'
          assert str(m['agent_api_version'])=='1'
          assert str(m['mobile_api_version'])=='1'
          PY
          test -s dist/xnat-panel-v1.6.2.zip
          test -s dist/xnat-host-agent-v1.2.0.zip
          test -s dist/xnat-bootstrap-panel-v1.6.2.sh
          test -s dist/xnat-bootstrap-host-v1.6.2.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.6.2 >/dev/null 2>&1; then
            echo 'v1.6.2 already exists' >&2
            exit 1
          fi
          gh release create v1.6.2 \
            --repo kkx999/xnat \
            --target ec621031854e22cdcd93776b0c4c387e92ce77cf \
            --title 'XNAT v1.6.2' \
            --notes-file dist/RELEASE_NOTES.md \
            dist/release.json \
            dist/RELEASE_NOTES.md \
            dist/SHA256SUMS.txt \
            dist/xnat-bootstrap-host-v1.6.2.sh \
            dist/xnat-bootstrap-panel-v1.6.2.sh \
            dist/xnat-host-agent-v1.2.0.zip \
            dist/xnat-panel-v1.6.2.zip
      - name: Remove one-shot publisher
        shell: bash
        run: |
          git config user.name 'XNAT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/publish-v162.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git commit -m 'chore: remove v1.6.2 publisher'
          git push origin HEAD:main
